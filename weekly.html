<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ── Weekly Challenge: lobby ─────────────────────────────────────────────── */
.wk-hero{background:var(--pu-dark);border-radius:14px;padding:22px 26px;margin-bottom:16px;position:relative;overflow:hidden;}
.wk-hero::after{content:"";position:absolute;right:-10px;top:-10px;width:100px;height:100px;border-radius:50%;background:rgba(167,139,250,0.1);pointer-events:none;}
.wk-hero-tag{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:6px;display:flex;align-items:center;gap:7px;}
.wk-live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:wkPulse 2s infinite;}
@keyframes wkPulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.wk-hero h2{font-family:var(--font-serif);font-size:24px;font-weight:500;color:#fff;margin-bottom:6px;}
.wk-hero p{font-size:13.5px;color:rgba(255,255,255,0.62);line-height:1.6;max-width:560px;}
.wk-hero p strong{color:#fff;font-weight:600;}
.wk-meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.wk-pill{font-size:11px;font-weight:500;background:rgba(255,255,255,0.1);border:0.5px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.72);padding:4px 11px;border-radius:20px;display:flex;align-items:center;gap:5px;}
.wk-pill svg{width:12px;height:12px;fill:none;stroke:rgba(255,255,255,0.72);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.wk-countdown{background:rgba(255,255,255,0.08);border-radius:10px;padding:12px 16px;margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.wk-countdown svg{width:15px;height:15px;fill:none;stroke:var(--pu-light);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.wk-countdown-text{font-size:13px;color:rgba(255,255,255,0.75);flex:1;min-width:180px;}
.wk-countdown-time{font-family:var(--font-serif);font-size:17px;color:var(--pu-light);font-variant-numeric:tabular-nums;white-space:nowrap;}
.wk-actions{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;}
.wk-main-btn{background:var(--pu-light);color:var(--pu-dark);border:none;border-radius:10px;padding:12px 24px;font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,transform .15s;text-decoration:none;}
.wk-main-btn:hover{background:#fff;transform:translateY(-1px);}
.wk-main-btn svg{width:14px;height:14px;fill:none;stroke:var(--pu-dark);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wk-main-btn:disabled{opacity:.6;cursor:wait;transform:none;}
.wk-hint{font-size:12px;color:rgba(255,255,255,0.55);line-height:1.5;}
.wk-done{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;}
.wk-done-score{background:rgba(255,255,255,0.1);border:0.5px solid rgba(255,255,255,0.18);border-radius:12px;padding:10px 16px;display:flex;align-items:baseline;gap:8px;}
.wk-done-score b{font-family:var(--font-serif);font-size:26px;font-weight:500;color:#fff;}
.wk-done-score span{font-size:12.5px;color:rgba(255,255,255,0.65);}
.wk-lock{display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(255,255,255,0.7);}
.wk-lock svg{width:15px;height:15px;fill:none;stroke:var(--pu-light);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

.wk-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start;}
.wk-col{display:flex;flex-direction:column;gap:14px;min-width:0;}
.wk-card{background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:14px;overflow:hidden;}
.wk-card-hdr{padding:14px 18px 12px;border-bottom:0.5px solid var(--lav-border);display:flex;align-items:center;gap:8px;}
.wk-card-hdr svg{width:16px;height:16px;fill:none;stroke:var(--pu-mid);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.wk-card-title{font-size:14px;font-weight:600;color:var(--pu-dark);}
.wk-card-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.wk-lb-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:0.5px solid rgba(180,150,220,0.12);}
.wk-lb-row:last-child{border-bottom:none;}
.wk-lb-row.me{background:var(--pu-ultra);}
html[data-theme="dark"] .wk-lb-row.me{background:rgba(167,139,250,.1);}
.wk-lb-rank{font-size:13px;font-weight:600;color:var(--muted);width:26px;flex-shrink:0;text-align:center;font-variant-numeric:tabular-nums;}
.wk-lb-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0;}
.wk-lb-name{font-size:13px;font-weight:500;color:var(--pu-dark);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wk-you{font-size:10px;font-weight:600;background:var(--pu-mid);color:#fff;border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:1px;}
.wk-lb-time{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:46px;text-align:right;}
.wk-lb-score{font-size:13px;font-weight:600;color:var(--pu-mid);font-variant-numeric:tabular-nums;width:42px;text-align:right;}
.wk-lb-sep{text-align:center;color:var(--muted);font-size:12px;padding:2px 0;letter-spacing:3px;}
.wk-empty{padding:26px 18px;text-align:center;font-size:13px;color:var(--muted);line-height:1.6;}
.wk-how-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:0.5px solid rgba(180,150,220,0.12);}
.wk-how-item:last-child{border-bottom:none;}
.wk-how-ico{width:32px;height:32px;border-radius:8px;background:var(--pu-pale);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.wk-how-ico svg{width:15px;height:15px;fill:none;stroke:var(--pu-mid);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.wk-how-title{font-size:13px;font-weight:600;color:var(--pu-dark);margin-bottom:2px;}
.wk-how-desc{font-size:12px;color:var(--moss);line-height:1.5;}
.wk-last{padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.wk-last-line{font-size:13px;color:var(--moss);line-height:1.55;}
.wk-last-line strong{color:var(--pu-dark);}
.wk-sec-btn{align-self:flex-start;background:var(--pu-mid);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font-sans);display:inline-flex;align-items:center;gap:6px;transition:background .15s;}
.wk-sec-btn:hover{background:var(--pu-dark);}
.wk-sec-btn svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wk-err{padding:40px 20px;text-align:center;font-size:14px;color:var(--muted);line-height:1.7;}
.wk-err a,.wk-err button{color:var(--pu-mid);font-weight:600;background:none;border:none;cursor:pointer;font:inherit;text-decoration:underline;}

/* ── Attempt ─────────────────────────────────────────────────────────────── */
.wq{max-width:780px;margin:0 auto;}
.wq-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
.wq-title{font-family:var(--font-serif);font-size:20px;font-weight:500;color:var(--pu-dark);}
.wq-title span{font-family:var(--font-sans);font-size:12px;color:var(--muted);margin-left:6px;font-weight:500;}
.wq-timer{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--pu-dark);background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:20px;padding:5px 12px;font-variant-numeric:tabular-nums;}
.wq-timer svg{width:13px;height:13px;fill:none;stroke:var(--pu-mid);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wq-dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.wq-dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--lav-border);background:var(--lav-card);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font-sans);transition:all .15s;}
.wq-dot.done{background:var(--pu-pale);color:var(--pu-dark);border-color:var(--pu-light);}
.wq-dot.on{outline:2px solid var(--pu-mid);outline-offset:1px;}
.wq-dot.ok{background:#dcfce7;color:#166534;border-color:#86efac;}
.wq-dot.bad{background:var(--pk-pale);color:var(--red);border-color:var(--pk-border);}
.wq-dot.none{background:#f1f5f9;color:#64748b;border-color:#cbd5e1;}
html[data-theme="dark"] .wq-dot.ok{background:rgba(74,222,128,.14);color:#86efac;border-color:rgba(74,222,128,.35);}
html[data-theme="dark"] .wq-dot.bad{background:rgba(244,114,182,.12);color:#f9a8d4;border-color:rgba(244,114,182,.35);}
html[data-theme="dark"] .wq-dot.none{background:rgba(148,163,184,.12);color:#cbd5e1;border-color:rgba(148,163,184,.3);}
.wq-card{background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:16px;padding:22px 24px;box-shadow:0 18px 40px -32px rgba(61,31,122,.45);}
.wq-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.wq-num{font-size:12px;font-weight:600;color:var(--muted);}
.wq-topic{font-size:11px;background:var(--pu-pale);color:var(--pu-mid);padding:3px 10px;border-radius:20px;font-weight:500;}
.wq-stem{font-size:15px;color:var(--ink);line-height:1.72;margin-bottom:18px;}
.wq-opts{display:flex;flex-direction:column;gap:8px;}
.wq-opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1.5px solid var(--lav-border);border-radius:11px;font-size:14px;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s;background:var(--lav-card);text-align:left;font-family:var(--font-sans);line-height:1.5;width:100%;}
.wq-opt:hover{border-color:var(--pu-light);background:var(--pu-ultra);}
.wq-opt[aria-pressed="true"]{border-color:var(--pu-mid);background:var(--pu-pale);}
html[data-theme="dark"] .wq-opt:hover{background:rgba(167,139,250,.08);}
html[data-theme="dark"] .wq-opt[aria-pressed="true"]{background:rgba(167,139,250,.16);}
.wq-ltr{width:24px;height:24px;border-radius:7px;background:var(--pu-pale);color:var(--pu-dark);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:-1px;}
.wq-opt[aria-pressed="true"] .wq-ltr{background:var(--pu-mid);color:#fff;}
.wq-nav{display:flex;align-items:center;gap:10px;margin-top:14px;}
.wq-nav .grow{flex:1;text-align:center;font-size:12px;color:var(--muted);}
.wq-nav > :last-child,.wr-nav > :last-child{margin-left:auto;}
.wq-btn{border:none;border-radius:10px;padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font-sans);transition:background .15s;}
.wq-btn-ghost{background:var(--lav-card);color:var(--moss);border:0.5px solid var(--lav-border);}
.wq-btn-ghost:hover:not(:disabled){border-color:var(--pu-light);color:var(--pu-dark);}
.wq-btn-ghost:disabled{opacity:.4;cursor:default;}
.wq-btn-main{background:var(--pu-mid);color:#fff;}
.wq-btn-main:hover:not(:disabled){background:var(--pu-dark);}
.wq-btn-main:disabled{opacity:.6;cursor:wait;}
.wq-confirm{margin-top:14px;background:var(--pk-pale);border:0.5px solid var(--pk-border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.wq-confirm p{flex:1;min-width:200px;font-size:13px;color:var(--ink);line-height:1.5;}
html[data-theme="dark"] .wq-confirm{background:rgba(244,114,182,.1);border-color:rgba(244,114,182,.3);}

/* ── Submitted ───────────────────────────────────────────────────────────── */
.wk-res{max-width:620px;margin:10px auto 0;background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:18px;padding:30px 28px;text-align:center;box-shadow:0 18px 40px -32px rgba(61,31,122,.45);}
.wk-res-tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;}
.wk-res h2{font-family:var(--font-serif);font-size:26px;font-weight:500;color:var(--pu-dark);margin:6px 0 2px;}
.wk-res-score{font-family:var(--font-serif);font-size:60px;color:var(--pu-mid);line-height:1;margin:14px 0 6px;font-variant-numeric:tabular-nums;}
.wk-res-score span{font-size:26px;color:var(--muted);}
.wk-res-sub{font-size:14px;color:var(--moss);line-height:1.6;}
.wk-res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0;}
.wk-res-stat{background:var(--pu-ultra);border:0.5px solid var(--lav-border);border-radius:12px;padding:12px 6px;}
html[data-theme="dark"] .wk-res-stat{background:rgba(167,139,250,.07);}
.wk-res-stat b{display:block;font-family:var(--font-serif);font-size:20px;font-weight:500;color:var(--pu-dark);font-variant-numeric:tabular-nums;}
.wk-res-stat span{font-size:11px;color:var(--muted);}
.wk-res-lock{display:flex;align-items:flex-start;gap:10px;text-align:left;background:var(--pu-pale);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--pu-dark);line-height:1.55;margin-bottom:20px;}
html[data-theme="dark"] .wk-res-lock{background:rgba(167,139,250,.12);}
.wk-res-lock svg{width:16px;height:16px;fill:none;stroke:var(--pu-mid);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:2px;}
.wk-res-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.wk-res-btns a,.wk-res-btns button{text-decoration:none;}

/* ── Review (Tutor Mode) — same look as the timed-exam review ───────────── */
.qcard{max-width:820px;margin:0 auto;background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:18px;padding:26px 30px 28px;box-shadow:0 18px 40px -32px rgba(61,31,122,.45);}
.qcard .q-wrapper{padding:0;}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
.qnum{font-family:var(--font-serif);font-size:20px;font-weight:500;color:var(--pu-dark);font-variant-numeric:tabular-nums;}
.qnum span{color:var(--muted);font-size:15px;}
.rv-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;}
.rv-status.correct{background:#dcfce7;color:#166534;}
.rv-status.wrong{background:var(--pk-pale);color:var(--red);}
.rv-status.none{background:#f1f5f9;color:#475569;}
.rv-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px;}
.rv-sum div{border-radius:12px;padding:11px 14px;border:0.5px solid var(--lav-border);background:#fff;}
.rv-sum dt{font-size:11.5px;color:var(--muted);margin-bottom:3px;}
.rv-sum dd{font-size:14px;font-weight:600;line-height:1.45;color:var(--ink);margin:0;}
.rv-sum .is-wrong{background:var(--pk-pale);border-color:var(--pk-border);}
.rv-sum .is-wrong dd{color:var(--red);}
.rv-sum .is-right{background:#e8f8ee;border-color:#a7e3bd;}
.rv-sum .is-right dd{color:#166534;}
.rv-sum .is-none dd{color:#475569;font-style:italic;font-weight:500;}
.wr{max-width:820px;margin:0 auto;}
.wr-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.wr-nav{max-width:820px;margin:14px auto 0;display:flex;align-items:center;gap:10px;}
.wr-nav .grow{flex:1;text-align:center;font-size:12px;color:var(--muted);}

@media (max-width:760px){
  .wk-grid{grid-template-columns:1fr;}
  .wk-hero{padding:20px 18px;}
  .wk-hero h2{font-size:21px;}
  .wq-card,.qcard{padding:18px 16px 20px;border-radius:14px;}
  .rv-sum{grid-template-columns:1fr;}
  .wk-res{padding:24px 16px;}
  .wk-res-score{font-size:52px;}
  .wq-btn{padding:10px 14px;}
  .wq-nav .grow{display:none;}
  .wr-nav .grow{display:none;}
  .wk-lb-time{display:none;}
}
</style>

function syncClock(serverNow){ if(serverNow){ const t=Date.parse(serverNow); if(!isNaN(t)) clockOffset=t-Date.now(); } }
function ukWhen(iso,withDay=true){
  const d=new Date(iso);
  const day=d.toLocaleDateString('en-GB',{timeZone:'Europe/London',weekday:'long',day:'numeric',month:'long'});
  const time=d.toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'});
  return withDay?`${day} at ${time}`:time;
}
function ukDay(iso){ return new Date(iso).toLocaleDateString('en-GB',{timeZone:'Europe/London',weekday:'long'}); }
function left(iso){
  let ms=Math.max(0,Date.parse(iso)-nowMs());
  const d=Math.floor(ms/864e5); ms-=d*864e5;
  const h=Math.floor(ms/36e5); ms-=h*36e5;
  const m=Math.floor(ms/6e4); const s=Math.floor((ms-m*6e4)/1e3);
  if(d>0) return `${d}d ${h}h ${m}m`;
  if(h>0) return `${h}h ${m}m`;
  return `${m}m ${String(s).padStart(2,'0')}s`;
}
function mmss(sec){ sec=Math.max(0,Math.round(sec||0)); const m=Math.floor(sec/60), s=sec%60; return `${m}:${String(s).padStart(2,'0')}`; }

}

function tickLobby(){
  document.querySelectorAll('[data-until]').forEach(el=>{

}

async function startAttempt(){
  const b=$('wkGo'); if(b){ b.disabled=true; b.textContent='Loading…'; }
  const{data,error}=await sb.rpc('start_weekly_challenge');
  if(error){
    const c=errCode(error);
    if(c==='already_completed') toast('You’ve already completed this week’s challenge.');
    else if(c==='no_live_challenge') toast('This challenge has just closed.');
    else toast('Something went wrong. Please try again.');
    loadLobby(); return;
  }
  syncClock(data.server_now);
  att={number:data.number, week_start:data.week_start, closes_at:data.closes_at, started_at:data.started_at,
       questions:(data.questions||[]).map(q=>({...q,options:Array.isArray(q.options)?q.options:JSON.parse(q.options||'[]')})),
       answers:{}, i:0};
  const saved=loadLocal();
  if(saved){ att.answers=saved.answers||{}; att.i=Math.min(saved.i||0,att.questions.length-1); }
  window.addEventListener('beforeunload',warnLeave);
  screen='attempt';
  renderQ();
  startTick(tickAttempt);
}
function warnLeave(e){ if(att&&!submitting){ e.preventDefault(); e.returnValue=''; } }
function answeredCount(){ return att.questions.filter(q=>att.answers[q.id]!==undefined).length; }

  const unanswered=n-answeredCount();
  $('mainContent').innerHTML=`<div class="wq">
    <div class="wq-top">
      <div class="wq-title">Challenge #${att.number}<span>${answeredCount()} of ${n} answered</span></div>
      <div class="wq-timer" title="Time since you started">${ICON.clock}<span id="wqTimer">${mmss((nowMs()-Date.parse(att.started_at))/1000)}</span></div>
    </div>
    <div class="wq-dots">${dots}</div>
    <article class="wq-card">
      <div class="wq-meta"><span class="wq-num">Question ${att.i+1} of ${n}</span>${q.paper?`<span class="wq-topic">${esc(q.paper)}</span>`:''}</div>
      <div class="wq-stem">${esc(q.stem)}</div>
      <div class="wq-opts" role="group" aria-label="Answer options">
        ${q.options.map((o,k)=>`<button class="wq-opt" aria-pressed="${sel===k}" onclick="pick(${k})"><span class="wq-ltr">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join('')}
      </div>
    </article>
    <div class="wq-nav">
      <button class="wq-btn wq-btn-ghost" onclick="goQ(${att.i-1})" ${att.i===0?'disabled':''}>Previous</button>
      <span class="grow">Answers stay hidden until ${ukDay(att.closes_at)}</span>
      ${last?`<button class="wq-btn wq-btn-main" id="wqSubmit" onclick="askSubmit()">Submit answers</button>`
            :`<button class="wq-btn wq-btn-main" onclick="goQ(${att.i+1})">Next</button>`}
    </div>
    ${confirm?`<div class="wq-confirm" id="wqConfirm"><p>${unanswered?`You have <strong>${unanswered}</strong> unanswered question${unanswered===1?'':'s'}. Unanswered questions score zero.`:'Ready to submit? You only get one attempt.'}</p>
      <button class="wq-btn wq-btn-ghost" onclick="renderQ()">Go back</button>
      <button class="wq-btn wq-btn-main" id="wqSubmitNow" onclick="doSubmit()">Submit${unanswered?' anyway':''}</button></div>`:''}
  </div>`;
  if(confirm){ const c=$('wqConfirm'); if(c) c.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function pick(k){ att.answers[att.questions[att.i].id]=k; saveLocal(); renderQ(); }
function goQ(j){ if(j<0||j>=att.questions.length) return; att.i=j; saveLocal(); renderQ(); window.scrollTo({top:0,behavior:'smooth'}); }
function askSubmit(){ renderQ(true); }
function tickAttempt(){
  if(!att) return;
  const el=$('wqTimer'); if(el) el.textContent=mmss((nowMs()-Date.parse(att.started_at))/1000);
  if(Date.parse(att.closes_at)-nowMs()<=0 && !submitting){ toast('Time’s up. The challenge has closed, so your answers have been submitted.'); doSubmit(); }
}
async function doSubmit(){
  if(submitting) return; submitting=true;
  ['wqSubmit','wqSubmitNow'].forEach(id=>{ const b=$(id); if(b){ b.disabled=true; b.textContent='Submitting…'; } });
  const payload=att.questions.map(q=>({question_id:q.id, selected:att.answers[q.id]!==undefined?att.answers[q.id]:-1}));
  const{data,error}=await sb.rpc('submit_weekly_challenge',{p_answers:payload});
  submitting=false;
  if(error){
    const c=errCode(error);
    if(c==='already_completed'||c==='not_started'){ clearLocal(); window.removeEventListener('beforeunload',warnLeave); toast('This attempt has already been submitted.'); loadLobby(); return; }
    toast('We couldn’t submit just now. Check your connection and try again.');
    ['wqSubmit','wqSubmitNow'].forEach(id=>{ const b=$(id); if(b){ b.disabled=false; b.textContent='Submit answers'; } });
    return;
  }
  clearLocal(); window.removeEventListener('beforeunload',warnLeave);
  stopTick();
  const closes=att.closes_at; att=null;
  renderSubmitted(data, closes);
  sb.from('profiles').select('xp,current_streak').eq('id',user.id).single().then(({data:p})=>{ if(p){ profile={...(profile||{}),...p}; updateTopbar(profile);} });
}
function renderSubmitted(r, closes){
  screen='submitted';
  const pct=r.total?r.score/r.total:0;
  const title=pct>=0.9?'Outstanding':pct>=0.7?'Great work':pct>=0.5?'Solid effort':'Every question counts';
  const opens=r.review_opens_at||closes;
  $('mainContent').innerHTML=`<div class="wk-res">
    <div class="wk-res-tag">Challenge #${r.number} · submitted</div>
    <h2>${title}</h2>
    <div class="wk-res-score">${r.score}<span>/${r.total}</span></div>
    <div class="wk-res-sub">You’re <strong>#${r.rank}</strong> of ${r.entrants} so far, and your score is on this week’s board. You’ve earned ${5*r.score} XP.</div>
    <div class="wk-res-stats">
      <div class="wk-res-stat"><b>${r.score}/${r.total}</b><span>Correct</span></div>
      <div class="wk-res-stat"><b>#${r.rank}</b><span>Current rank</span></div>
      <div class="wk-res-stat"><b>${mmss(r.time_taken)}</b><span>Time</span></div>
    </div>
    <div class="wk-res-lock">${ICON.lock}<div>Answers and full explanations unlock on <strong>${ukWhen(opens)}</strong>, when the challenge closes. That keeps it fair for everyone still to play. <span style="white-space:nowrap">(<span data-until="${opens}">${left(opens)}</span> to go)</span></div></div>
    <div class="wk-res-btns">
      <button class="wk-main-btn" style="background:var(--pu-mid);color:#fff" onclick="loadLobby()">${ICON.trophy.replace('<svg','<svg style="stroke:#fff"')} See the board</button>
      <a class="btn-outline" style="padding:12px 20px;font-size:14px;border-radius:10px" href="dashboard.html">Back to dashboard</a>
    </div>
  </div>`;
  startTick(()=>document.querySelectorAll('[data-until]').forEach(el=>el.textContent=left(el.dataset.until)));
}

// ── Review (after Tuesday 00:01) ─────────────────────────────────────────────
async function openReview(number){
  stopTick();
  $('mainContent').innerHTML='<div class="loading-full">Loading the answers…</div>';
  const{data,error}=await sb.rpc('get_weekly_review',{p_number:number});
  if(error){
    toast(errCode(error)==='review_locked'?'Answers unlock when the challenge closes on Tuesday at 00:01.':'We couldn’t load the answers just now.');
    loadLobby(); return;
  }
  const answers={}; (data.answers||[]).forEach(a=>{ answers[a.question_id]=a.selected; });
  review={number:data.number, my:data.my, i:0, answers,
    questions:(data.questions||[]).map(q=>({...q, type:q.type||'SBA', options:Array.isArray(q.options)?q.options:JSON.parse(q.options||'[]')}))};
  try{ history.replaceState(null,'',`weekly.html?review=${number}`); }catch(e){}
  screen='review';
  renderReview();
}
function rvStatus(q){ const s=review.answers[q.id]; if(s===undefined||s===null||s<0) return 'none'; return s===q.correct_answer?'correct':'wrong'; }
function renderReview(){
  const r=review, q=r.questions[r.i], n=r.questions.length, tc=q.tutor_content;
  const s=rvStatus(q), sel=s==='none'?null:r.answers[q.id];
  const played=r.my!=null;
  const dots=r.questions.map((x,j)=>{ const st=played?rvStatus(x):''; const cls=st==='correct'?' ok':st==='wrong'?' bad':st==='none'?' none':'';
    return `<button class="wq-dot${cls}${j===r.i?' on':''}" onclick="goRv(${j})" aria-label="Question ${j+1}${st?', '+(st==='correct'?'correct':st==='wrong'?'incorrect':'not answered'):''}"${j===r.i?' aria-current="true"':''}>${j+1}</button>`; }).join('');
  const statusHtml=!played?'':s==='correct'?'<span class="rv-status correct">✓ Correct</span>':s==='wrong'?'<span class="rv-status wrong">✗ Incorrect</span>':'<span class="rv-status none">– Not answered</span>';
  const ans=k=>`${LETTERS[k]} — ${q.options[k]}`;
  let html=`<div class="wr">
    <div class="wr-top">
      <div class="wq-title">Challenge #${r.number} answers${played?`<span>You scored ${r.my.score}/${r.my.total} · #${r.my.rank}</span>`:''}</div>
      <button class="wq-btn wq-btn-ghost" onclick="closeReview()">Back to the challenge</button>
    </div>
    <div class="wq-dots">${dots}</div>
  </div>
  <article class="qcard"><div class="q-wrapper">
    <div class="qhead"><h1 class="qnum">Question ${r.i+1} <span>of ${n}</span></h1>${statusHtml}</div>
    <div class="q-badge-row">
      ${q.question_id?`<span class="badge badge-id">${esc(q.question_id)}</span>`:''}
      ${q.topic||q.paper?`<span class="badge badge-topic">${esc(q.topic||q.paper)}</span>`:''}
      <span class="badge badge-type">${esc(q.type)}</span>
      ${q.domain?`<span class="badge badge-domain">${esc(q.domain)}</span>`:''}
    </div>
    ${played?`<dl class="rv-sum">
      <div class="${s==='correct'?'is-right':s==='wrong'?'is-wrong':'is-none'}"><dt>Your answer</dt><dd>${s==='none'?'Not answered':esc(ans(sel))}</dd></div>
      <div class="is-right"><dt>Correct answer</dt><dd>${esc(ans(q.correct_answer))}</dd></div>
    </dl>`:''}`;
  let stemHtml;
  try{ const a=getStemAnnotations(q,tc); stemHtml=annotateStem(q.stem,a.clues,a.distractors); }catch(e){ stemHtml=escapeHtml(q.stem); }
  html+=`<div class="q-stem">${stemHtml}</div>`;
  html+=stemLegendHtml(stemHtml);
  html+=`<div class="options-list">${q.options.map((o,k)=>renderAnsweredOption(q,o,k,sel,tc)).join('')}</div>`;
  if(tc){ try{ html+=renderTutorPanels(q,sel,tc,{unanswered:played&&s==='none',bottomNavHtml:''}); }catch(e){ console.error('renderTutorPanels failed:',e); } }
  html+=`</div></article>
  <div class="wr-nav">
    <button class="wq-btn wq-btn-ghost" onclick="goRv(${r.i-1})" ${r.i===0?'disabled':''}>Previous</button>
    <span class="grow">Question ${r.i+1} of ${n}</span>
    ${r.i<n-1?`<button class="wq-btn wq-btn-main" onclick="goRv(${r.i+1})">Next</button>`:`<button class="wq-btn wq-btn-main" onclick="closeReview()">Finish review</button>`}
  </div>`;
  $('mainContent').innerHTML=html;
}
function goRv(j){ if(j<0||j>=review.questions.length) return; review.i=j; renderReview(); window.scrollTo({top:0,behavior:'smooth'}); }
function closeReview(){ try{ history.replaceState(null,'','weekly.html'); }catch(e){} loadLobby(); window.scrollTo({top:0}); }

document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&screen==='lobby') loadLobby(); });

init();
</script>
</body>
</html>
