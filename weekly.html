<style>

/* HERO BANNER */

.s-dot{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;}

.sd-now{background:rgba(255,255,255,0.08);border:1.5px dashed rgba(255,255,255,0.25);color:rgba(255,255,255,0.4);}

/* TOPIC BARS */

.tp-fill{height:100%;border-radius:3px;}

/* FORM */

.wk-hero{background:var(--pu-dark);border-radius:14px;padding:22px 26px;margin-bottom:16px;position:relative;overflow:hidden;}
.wk-hero::after{content:"";position:absolute;right:-10px;top:-10px;width:100px;height:100px;border-radius:50%;background:rgba(167,139,250,0.1);}
.wk-hero-tag{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:6px;}
.wk-hero h2{font-family:var(--font-serif);font-size:22px;color:#fff;margin-bottom:6px;}
.wk-hero p{font-size:13px;color:rgba(255,255,255,0.38);line-height:1.6;max-width:500px;}
.wk-meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.wk-pill{font-size:11px;font-weight:500;background:rgba(255,255,255,0.1);border:0.5px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);padding:4px 11px;border-radius:20px;display:flex;align-items:center;gap:5px;}
.wk-pill svg{width:12px;height:12px;fill:none;stroke:rgba(255,255,255,0.6);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.wk-countdown{background:rgba(255,255,255,0.08);border-radius:10px;padding:12px 16px;margin-top:14px;display:flex;align-items:center;gap:8px;}
.wk-countdown svg{width:15px;height:15px;fill:none;stroke:var(--pu-light);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.wk-countdown-text{font-size:13px;color:rgba(255,255,255,0.7);}
.wk-countdown-time{font-family:var(--font-serif);font-size:16px;color:var(--pu-light);font-weight:400;}
.wk-main-btn{background:var(--pu-light);color:var(--pu-dark);border:none;border-radius:10px;padding:12px 24px;font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all 0.15s;margin-top:14px;text-decoration:none;}
.wk-main-btn:hover{background:#fff;}
.wk-main-btn svg{width:14px;height:14px;fill:none;stroke:var(--pu-dark);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wk-main-btn.disabled{opacity:0.4;cursor:not-allowed;}
.wk-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
.wk-card{background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:14px;overflow:hidden;}
.wk-card-hdr{padding:14px 18px 12px;border-bottom:0.5px solid var(--lav-border);display:flex;align-items:center;gap:8px;}
.wk-card-hdr svg{width:16px;height:16px;fill:none;stroke:var(--pu-mid);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.wk-card-title{font-size:14px;font-weight:600;color:var(--pu-dark);}
.wk-card-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.wk-lb-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:0.5px solid rgba(180,150,220,0.1);}
.wk-lb-row:last-child{border-bottom:none;}
.wk-lb-rank{font-size:13px;font-weight:600;color:var(--muted);width:24px;flex-shrink:0;}
.wk-lb-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0;}
.wk-lb-name{font-size:13px;font-weight:500;color:var(--pu-dark);flex:1;}
.wk-lb-score{font-size:13px;font-weight:600;color:var(--pu-mid);}
.wk-how-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:0.5px solid rgba(180,150,220,0.1);}
.wk-how-item:last-child{border-bottom:none;}
.wk-how-ico{width:32px;height:32px;border-radius:8px;background:var(--pu-pale);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.wk-how-ico svg{width:15px;height:15px;fill:none;stroke:var(--pu-mid);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.wk-how-title{font-size:13px;font-weight:600;color:var(--pu-dark);margin-bottom:2px;}
.wk-how-desc{font-size:12px;color:var(--moss);line-height:1.5;}
/* Question UI */
.q-card{background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:14px;padding:20px;margin-bottom:14px;}
.q-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.q-num{font-size:12px;font-weight:600;color:var(--muted);}
.q-topic{font-size:11px;background:var(--pu-pale);color:var(--pu-mid);padding:3px 10px;border-radius:20px;}
.q-stem{font-size:15px;color:var(--ink);line-height:1.7;margin-bottom:18px;font-weight:500;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{padding:12px 16px;border:1.5px solid var(--lav-border);border-radius:10px;font-size:14px;color:var(--moss);cursor:pointer;transition:all 0.15s;background:#fff;text-align:left;font-family:var(--font-sans);}
.q-opt:hover:not(:disabled){border-color:var(--pu-light);background:var(--pu-pale);color:var(--pu-dark);}
.q-opt.selected{border-color:var(--pu-mid);background:var(--pu-pale);color:var(--pu-dark);}
.q-opt.correct{border-color:#2a5a2a;background:#e2f4e2;color:#1a3a1a;}
.q-opt.wrong{border-color:var(--red);background:var(--pk-pale);color:var(--red);}
.q-exp{background:var(--pu-pale);border-left:3px solid var(--pu-mid);padding:14px 16px;border-radius:0 10px 10px 0;margin-top:14px;font-size:13.5px;color:var(--pu-dark);line-height:1.7;}
.q-nav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
.btn-next{background:var(--pu-mid);color:#fff;border:none;border-radius:9px;padding:10px 22px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:var(--font-sans);}
.progress-bar-wrap{height:5px;background:var(--pu-pale);border-radius:5px;overflow:hidden;margin-bottom:16px;}
.progress-bar-fill{height:100%;background:var(--pu-mid);border-radius:5px;transition:width 0.3s;}
.wk-results{background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:14px;padding:32px;text-align:center;}
.wk-results h2{font-family:var(--font-serif);font-size:28px;color:var(--pu-dark);margin-bottom:8px;}
.wk-results .score{font-family:var(--font-serif);font-size:56px;color:var(--pu-mid);font-weight:400;line-height:1;margin:16px 0 8px;}
.wk-results p{font-size:15px;color:var(--moss);}

</style>

<script>
const SUPABASE_URL='https://judtpdikbidvccclftvq.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1ZHRwZGlrYmlkdmNjY2xmdHZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NTQ2NDMsImV4cCI6MjA5MTEzMDY0M30.GyS7rKKWnmXf5fbqrdSkuszrZ31xOqY5Will3C2J0WA';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function signOut(){sb.auth.signOut().then(()=>window.location.href='login.html');}

function updateTopbar(profile){
  const streak = profile?.current_streak||0;

}
function setUserInfo(name, username){
  const initials = ossifyInitials(name);
  document.getElementById('userAv').textContent = initials;
  document.getElementById('userName').textContent = name;
  if(username) document.getElementById('userUsername').textContent = '@'+username;
}





let user=null, profile=null, questions=[], currentQ=0, score=0, answered=0, selected=null, isAnswered=false;
let startTime=null, elapsed=0, timerInterval=null;

function getWeekStart(){
  const d=new Date();
  const day=d.getDay();
  const diff=d.getDate()-day+(day===0?-6:1);
  const mon=new Date(d.setDate(diff));
  return mon.toISOString().split('T')[0];
}

function getCountdown(){
  const now=new Date();
  const next=new Date(now);
  const day=now.getDay();
  const daysUntilMon=day===1?7:(8-day)%7;
  next.setDate(now.getDate()+daysUntilMon);
  next.setHours(0,0,0,0);
  const diff=next-now;
  const d=Math.floor(diff/86400000);
  const h=Math.floor((diff%86400000)/3600000);
  const m=Math.floor((diff%3600000)/60000);
  return{d,h,m};
}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return;}
  user=session.user;
  const name=ossifyDisplayName(null, user);
  document.getElementById('userAv').textContent=ossifyInitials(name, user.email);
  document.getElementById('userName').textContent=name;
  const{data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();
  profile=p;
  document.getElementById('topbarStreak').textContent=`🔥 ${p?.current_streak||0}`;
  document.getElementById('topbarXp').textContent=`⭐ ${p?.xp||0} XP`;
  document.getElementById('sidebarStreak').textContent=`🔥 ${p?.current_streak||0}`;

  const weekStart=getWeekStart();
  // Check if already completed this week
  const{data:entry}=await sb.from('weekly_entries').select('*').eq('user_id',user.id).eq('week_start',weekStart).single();
  // Get or create weekly challenge
  let{data:challenge}=await sb.from('weekly_challenges').select('*').eq('week_start',weekStart).single();
  if(!challenge){
    // Create new weekly challenge — pick 20 random question IDs
    const{data:qs}=await sb.from('questions').select('id').limit(200);
    if(!qs?.length){showError();return;}
    const shuffled=qs.sort(()=>Math.random()-0.5).slice(0,20);
    const qIds=shuffled.map(q=>q.id);
    const{data:newChallenge}=await sb.from('weekly_challenges').insert({week_start:weekStart,question_ids:qIds}).select().single();
    challenge=newChallenge;
  }
  // Load weekly leaderboard
  const{data:entries}=await sb.from('weekly_entries').select('*').eq('week_start',weekStart).order('score',{ascending:false}).limit(50);
  const{data:allProfiles}=await sb.from('profiles').select('id,username,full_name,hospital_trust').in('id',(entries||[]).map(e=>e.user_id));
  const profileMap={};(allProfiles||[]).forEach(p=>profileMap[p.id]=p);

  renderLobby(challenge, entry, entries, profileMap, weekStart);
}

function renderLobby(challenge, entry, weeklyLb){
  const now=new Date();
  const weekStart=getWeekStart();
  const weekEnd=new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate()+7);
  const timeLeft=weekEnd-now;
  const days=Math.floor(timeLeft/(1000*60*60*24));
  const hours=Math.floor((timeLeft%(1000*60*60*24))/(1000*60*60));
  const mins=Math.floor((timeLeft%(1000*60*60))/(1000*60));
  const countdownStr=`${days}d ${hours}h ${mins}m remaining`;
  const weekLabel=weekStart.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const done=!!entry;
  const lbRows=(weeklyLb||[]).slice(0,5).map((e,i)=>{
    const initials=ossifyInitials(e.profiles?.full_name, e.profiles?.email);
    const cols=['#7c5cbf','#9b6fd4','#6366f1','#818cf8','#a78bfa'];
    return`<div class="wk-lb-row">
      <div class="wk-lb-rank">${i+1<=3?['🥇','🥈','🥉'][i]:i+1}</div>
      <div class="wk-lb-av" style="background:${cols[i%cols.length]}">${initials}</div>
      <div class="wk-lb-name">${e.profiles?.full_name||e.profiles?.email?.split('@')[0]||'Doctor'}</div>
      <div class="wk-lb-score">${e.score}%</div>
    </div>`;
  }).join('');

  document.getElementById('pageContent').innerHTML=`
  <div class="wk-hero">
    <div class="wk-hero-tag">Weekly · Resets every Monday</div>
    <h2>Weekly Challenge</h2>
    <p>20 questions — the same set for every Ossify user this week. Ranked by accuracy, then speed. Complete it before Monday to appear on the leaderboard.</p>
    <div class="wk-meta">
      <div class="wk-pill"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> 20 Questions</div>
      <div class="wk-pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Speed matters</div>
      <div class="wk-pill"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Same for everyone</div>
      <div class="wk-pill"><svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg> Weekly leaderboard</div>
    </div>
    <div class="wk-countdown">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <div class="wk-countdown-text">Week of ${weekLabel} &nbsp;·&nbsp; <span class="wk-countdown-time">${countdownStr}</span></div>
    </div>
    ${!done?`<button class="wk-main-btn" onclick="startChallenge()">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Start Challenge
    </button>`:`<div class="wk-main-btn disabled">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      Completed this week — ${entry.score}% accuracy
    </div>`}
  </div>
  <div class="wk-grid">
    <div class="wk-card">
      <div class="wk-card-hdr">
        <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        <div><div class="wk-card-title">This week's leaderboard</div><div class="wk-card-sub">Week of ${weekLabel}</div></div>
      </div>
      ${lbRows||'<div class="empty-state" style="padding:24px;">No entries yet — be the first!</div>'}
    </div>
    <div class="wk-card">
      <div class="wk-card-hdr">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <div><div class="wk-card-title">How it works</div></div>
      </div>
      <div class="wk-how-item">
        <div class="wk-how-ico"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div>
        <div><div class="wk-how-title">Same questions for everyone</div><div class="wk-how-desc">Every Ossify user gets the same 20 questions each week — so the leaderboard is a true measure of skill.</div></div>
      </div>
      <div class="wk-how-item">
        <div class="wk-how-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
        <div><div class="wk-how-title">Speed is a tiebreaker</div><div class="wk-how-desc">If two doctors score the same accuracy, the faster one ranks higher.</div></div>
      </div>
      <div class="wk-how-item">
        <div class="wk-how-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg></div>
        <div><div class="wk-how-title">Win badges and XP</div><div class="wk-how-desc">Top the weekly leaderboard and earn the Weekly Champion badge (200 XP).</div></div>
      </div>
      <div class="wk-how-item">
        <div class="wk-how-ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div><div class="wk-how-title">Resets every Monday</div><div class="wk-how-desc">New questions every Monday at midnight. Your history is saved.</div></div>
      </div>
    </div>
  </div>`;
}

function renderQuestion(){
  if(currentQ>=questions.length){finishChallenge();return;}
  selected=null;isAnswered=false;
  const q=questions[currentQ];
  const opts=Array.isArray(q.options)?q.options:JSON.parse(q.options||'[]');
  document.getElementById('mainContent').innerHTML=`
  <div class="game-wrap">
    <div class="game-hdr">
      <div class="game-q-info">
        <div class="game-q-num">${currentQ+1} <span style="font-size:13px;color:var(--muted)">/ ${questions.length}</span></div>
        <div style="width:160px;height:5px;background:var(--surface3);border-radius:5px;overflow:hidden;"><div style="height:100%;width:${(currentQ/questions.length)*100}%;background:linear-gradient(90deg,var(--violet),#a855f7);border-radius:5px;transition:width 0.3s;"></div></div>
        <div style="font-size:12px;color:var(--muted)">Score: ${score}/${answered}</div>
      </div>
      <div class="game-timer" id="timerDisplay">0:00</div>
    </div>
    <div class="game-body">
      <div style="display:flex;gap:8px;margin-bottom:14px;"><span style="padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700;background:var(--violet-lt);color:var(--violet);border:1px solid rgba(124,58,237,0.2);">${q.type}</span><span style="padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700;background:var(--surface3);color:var(--muted);">${q.topic}</span></div>
      <div class="q-stem">${q.stem}</div>
      <div class="opts" id="optList">
        ${opts.map((o,i)=>`<div class="opt" id="wo${i}" onclick="selectOpt(${i})"><div class="opt-letter">${String.fromCharCode(65+i)}</div><div class="opt-txt">${o}</div></div>`).join('')}
      </div>
      <div class="game-actions">
        <button class="btn btn-outline" onclick="selectOpt(selected===null?0:selected);submitAnswer(${q.correct_answer})" id="submitBtn">Submit →</button>
        <button class="btn btn-violet" id="nextBtn" style="display:none" onclick="nextQ()">Next →</button>
      </div>
    </div>
  </div>`;
}

function selectOpt(i){if(isAnswered)return;selected=i;document.querySelectorAll('.opt').forEach((o,j)=>o.classList.toggle('sel',i===j));}
function submitAnswer(correct){
  if(selected===null){alert('Select an answer first.');return;}
  isAnswered=true;answered++;
  if(selected===correct)score++;
  document.querySelectorAll('.opt').forEach((o,i)=>{o.classList.add('disabled');if(i===correct)o.classList.add('corr');else if(i===selected&&selected!==correct)o.classList.add('incorr');});
  document.getElementById('submitBtn').style.display='none';
  document.getElementById('nextBtn').style.display='inline-flex';
}
function nextQ(){currentQ++;renderQuestion();}

async function finishChallenge(){
  clearInterval(timerInterval);
  const weekStart=getWeekStart();
  await sb.from('weekly_entries').upsert({user_id:user.id,week_start:weekStart,score,total:questions.length,time_taken:elapsed},{onConflict:'user_id,week_start'});
  // XP (score × 5, once per week) is awarded by the database when the entry is saved.
  const pct=Math.round((score/questions.length)*100);
  const emoji=pct>=80?'🏆':pct>=60?'⚡':'💪';
  const mins=Math.floor(elapsed/60);const secs=elapsed%60;
  document.getElementById('mainContent').innerHTML=`
  <div class="results-wrap">
    <div class="results-ico">${emoji}</div>
    <div class="results-title">${pct>=80?'Excellent!':pct>=60?'Well done!':'Good effort!'}</div>
    <div class="results-sub">You've completed this week's challenge. Your result has been saved to the leaderboard.</div>
    <div class="results-stats">
      <div class="rs"><div class="rs-val" style="color:var(--teal)">${score}/${questions.length}</div><div class="rs-lbl">Correct</div></div>
      <div class="rs"><div class="rs-val" style="color:var(--violet)">${pct}%</div><div class="rs-lbl">Accuracy</div></div>
      <div class="rs"><div class="rs-val" style="color:var(--amber)">${mins}m ${String(secs).padStart(2,'0')}s</div><div class="rs-lbl">Time</div></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <a href="leaderboard.html" class="btn btn-dark">🏆 View Leaderboard →</a>
      <a href="dashboard.html" class="btn btn-outline">← Dashboard</a>
    </div>
  </div>`;
}

function showError(){document.getElementById('mainContent').innerHTML='<div class="loading-full">Could not load challenge. <a href="dashboard.html" style="color:var(--gold);margin-left:8px;">← Back</a></div>';}

init();


</script>
</body>
</html>
