<style>

/* HERO BANNER */

.streak-dots{display:flex;align-items:center;gap:5px;margin-bottom:9px;}
.s-dot{min-width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;letter-spacing:.3px;padding:0 6px;}
.sd-on{background:rgba(255,255,255,0.28);color:#fff;}
.sd-today{background:#fff;color:var(--pu-dark);box-shadow:0 0 0 2px rgba(255,255,255,0.5);}
.sd-today-empty{background:rgba(255,255,255,0.08);border:1.5px dashed rgba(255,255,255,0.4);color:rgba(255,255,255,0.5);}

.sd-future{background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.1);}

/* TOPIC BARS */
.tp-bar{height:6px;background:rgba(255,255,255,0.08);border-radius:6px;overflow:hidden;margin-top:8px;display:flex;}
.tp-correct{background:#22c55e;height:100%;border-radius:6px 0 0 6px;transition:width .4s ease;}
.tp-incorrect{background:#ef4444;height:100%;transition:width .4s ease;}
.tp-correct:last-child,.tp-correct:only-child{border-radius:6px;}

/* FORM */

.topic-card{background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:10px;padding:12px;text-decoration:none;display:block;transition:all 0.15s;}

.topic-count{font-size:10.5px;color:var(--muted);margin-bottom:6px;}
.badges-wrap{display:flex;flex-wrap:wrap;gap:10px;}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:3px;}
.badge-ico-wrap{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.badge-ico-wrap svg{width:18px;height:18px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.badge-name{font-size:9px;color:var(--muted);text-align:center;max-width:60px;line-height:1.3;}
.badge-item.locked .badge-ico-wrap{filter:grayscale(1);opacity:0.25;}

/* Timed exam card */
.tx-card{margin-bottom:14px;}
.tx-body{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:16px 18px;}
.tx-score{font-family:var(--font-serif);font-size:38px;font-weight:300;line-height:1;color:var(--pu-dark);font-variant-numeric:tabular-nums;letter-spacing:-1px;}
.tx-score small{font-size:18px;color:var(--pu-light);margin-left:3px;letter-spacing:0;}
.tx-meta{font-size:12.5px;color:var(--muted);line-height:1.6;}
.tx-meta b{color:var(--pu-dark);font-weight:600;}
.tx-hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.tx-hist a{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--pu-pale);color:var(--pu-dark);text-decoration:none;border:0.5px solid var(--lav-border);transition:all .15s;}
.tx-hist a:hover{background:#e0d5fc;}
.tx-live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--red);}
.tx-live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);}
.tx-cta{transition:transform .18s,box-shadow .18s,background-color .18s;}
.tx-cta:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(61,31,122,.2);}
@media(max-width:700px){.tx-body{grid-template-columns:1fr;gap:12px;}}
</style>

async function updateStreak(userId,profile){

  const{data,error}=await sb.rpc('touch_activity');
  if(error){console.warn('Streak update failed:',error.message);return null;}

function streakDots(streak){
  // Show Mon–Sun of the current week.
  // Work backwards from today by `streak` days — any slot within that range lights up.
  // Broken streak → streak resets to ≤1, so only today (or nothing) is lit.
  const labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dow=new Date().getDay();          // 0=Sun … 6=Sat
  const todayIdx=dow===0?6:dow-1;        // 0=Mon … 6=Sun
  return labels.map((label,i)=>{
    const isFuture=i>todayIdx;
    const daysAgo=todayIdx-i;             // 0=today, 1=yesterday, …
    const inStreak=!isFuture&&daysAgo<streak;
    const isToday=i===todayIdx;
    let cls;
    if(isFuture)           cls='sd-future';
    else if(inStreak&&isToday) cls='sd-today';
    else if(inStreak)      cls='sd-on';
    else if(isToday)       cls='sd-today-empty';
    else                   cls='sd-off';
    return`<div class="s-dot ${cls}">${label}</div>`;
  }).join('');
}

  ];
  const gi=Math.floor(Math.random()*GREETINGS.length);
  const heroGreeting=GREETINGS[gi][0]+`<em>${first}${GREETINGS[gi][1]}</em>`;

  // Weak spots — topics with lowest progress count
  const topicCounts={};
  TOPICS.forEach(t=>topicCounts[t.id]=0);
  // Would normally join with questions - show first 3 topics alphabetically as placeholder
  // Weak spots: topics with lowest ACCURACY (correct/attempted) among attempted topics.
  // Using accuracy rate ensures e.g. 30/100 (30%) ranks weaker than 5/10 (50%).
  const weakSpots=TOPICS.map(t=>{
    const p=topicMap[t.id]||{attempted:0,correct:0};
    const accuracy=p.attempted>0 ? p.correct/p.attempted : null;
    return{...t,...p,accuracy};
  }).filter(t=>t.attempted>0)              // only topics the user has tried
    .sort((a,b)=>{
      if(a.accuracy!==b.accuracy) return a.accuracy-b.accuracy; // lower % = weaker
      return b.attempted-a.attempted;      // tiebreak: more data is more reliable
    });

  document.getElementById('mainContent').innerHTML=`
  ${!isPaid?`<div class="free-gate">
    <h3>Unlock your full question bank</h3>
    <p>Upgrade to access all 1,200+ questions, leaderboards, weekly challenges, and head-to-head duels.</p>
    <a href="pricing.html" class="btn-cta" style="display:inline-flex;text-decoration:none;">View pricing →</a>
  </div>`:''}
  <div class="dash-hero">
    <div class="dh-orb1"></div><div class="dh-orb2"></div>
    <div class="hero-greeting">Ossify MSRA</div>
    <div class="hero-title">${heroGreeting}</div>
    <div class="streak-dots">${streakDots(streak)}<span style="font-size:11px;color:rgba(255,255,255,0.3);margin-left:8px;">${streak} day streak</span></div>
    <div class="hero-sub">${streak>0?`${streak}-day streak active — consistency is the key to Band 4.`:'Start practising today to begin your streak.'}</div>
    <div class="hero-acts">
      <a href="practice.html" class="ha-w"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:var(--pu-dark);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Start Practice</a>
      <a href="exam.html" class="ha-g"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:rgba(255,255,255,0.65);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>Timed Exam</a>
      <a href="weekly.html" class="ha-g"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:rgba(255,255,255,0.65);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Weekly Challenge</a>
      <a href="duel.html" class="ha-g"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:rgba(255,255,255,0.65);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>Challenge Someone</a>
    </div>
  </div>
  <div class="stats">
    <div class="sc"><div class="sc-stripe" style="background:var(--pu-mid);"></div><div class="sc-ico" style="background:var(--pu-pale);"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:var(--pu-dark);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><polyline points="20 6 9 17 4 12"/></svg></div><div class="sc-val">${answered}</div><div class="sc-lbl">Questions answered</div></div>
    <div class="sc"><div class="sc-stripe" style="background:${accuracy>=60?'var(--pu-mid)':accuracy>=40?'var(--pu-light)':'var(--pk-mid)'};"></div><div class="sc-ico" style="background:${accuracy>=60?'var(--pu-pale)':accuracy>=40?'var(--pu-pale)':'var(--pk-pale)'};"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:${accuracy>=60?'var(--pu-dark)':accuracy>=40?'var(--pu-mid)':'var(--red)'};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg></div><div class="sc-val">${accuracy}%</div><div class="sc-lbl">Accuracy</div><div class="sc-note" style="color:${accuracy>=60?'var(--pu-mid)':accuracy>=40?'var(--pu-light)':'var(--red)'};">${correct} correct</div></div>
    <div class="sc"><div class="sc-stripe" style="background:${streak>0?'var(--pu-light)':'var(--muted)'};"></div><div class="sc-ico" style="background:var(--pu-pale);"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:var(--pu-mid);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div><div class="sc-val">${streak}</div><div class="sc-lbl">Day streak</div><div class="sc-note" style="color:var(--pu-mid);">Best: ${best} days</div></div>
    <div class="sc"><div class="sc-stripe" style="background:#c084fc;"></div><div class="sc-ico" style="background:#f3e8ff;"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:#7e22ce;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div><div class="sc-val">${xp}</div><div class="sc-lbl">XP earned</div></div>
    <div class="sc"><div class="sc-stripe" style="background:${flagged>0?'var(--pk-mid)':'var(--muted)'};"></div><div class="sc-ico" style="background:var(--pk-pale);"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:var(--red);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></div><div class="sc-val">${flagged}</div><div class="sc-lbl">Flagged for review</div></div>
  </div>
  ${txCard}
  <div class="two-col">
    <div class="card">
      <div class="card-hdr"><div><div class="card-title"><svg viewBox="0 0 24 24" style="stroke:var(--pu-mid);"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>You vs platform average</div><div class="card-sub">Based on all Ossify users</div></div></div>
      <div class="card-body">
        <div class="vs-grid">
          <div><div class="vs-val" style="color:${accuracy>=platformAvg?'var(--pu-mid)':'var(--pk-mid)'};">${accuracy}%</div><div class="vs-lbl">Your accuracy</div></div>
          <div class="vs-sep">vs</div>
          <div><div class="vs-val" style="color:var(--muted);">${platformAvg}%</div><div class="vs-lbl">Platform average</div></div>
        </div>
        <div class="vs-delta ${accuracy>=platformAvg?'good':'bad'}">${accuracy>=platformAvg?`↑ ${accuracy-platformAvg}% above average — great work`:`↓ ${platformAvg-accuracy}% below average — keep practising`}</div>
        <div class="mini2">
          <div class="m2"><div class="m2v">${answered}</div><div class="m2l">Questions done</div></div>
          <div class="m2"><div class="m2v">${best}d</div><div class="m2l">Best streak</div></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-hdr"><div><div class="card-title"><svg viewBox="0 0 24 24" style="stroke:var(--pk-mid);"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Weak spot tracker</div><div class="card-sub">Topics to prioritise</div></div></div>
      <div class="card-body">
        ${weakSpots.length===0
          ? `<div style="font-size:13px;color:var(--muted);padding:8px 0;line-height:1.6">Start practising to see your weak spots appear here.</div>`
          : weakSpots.slice(0,3).map(t=>{
              const accPct=Math.round(t.accuracy*100);
              const inc=t.attempted-t.correct;
              return `<div class="weak-item">
                <div class="weak-ico"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:var(--red);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
                <div class="weak-name">${t.id}</div>
                <div class="weak-pct">${accPct}% — ${t.correct}✓ ${inc}✗</div>
                <a href="practice.html?topic=${encodeURIComponent(t.id)}" class="weak-link">Revise →</a>
              </div>`;
            }).join('')}
      </div>
    </div>
  </div>
  <div class="sec-row"><div class="sec-h">All topics</div><a href="practice.html" class="sec-a">Browse all →</a></div>
  <div class="topics-grid" style="margin-bottom:14px;">
    ${TOPICS.map(t=>{
        const p=topicMap[t.id]||{attempted:0,correct:0};
        const att=Math.min(100,p.attempted);
        const cor=Math.min(att,p.correct);
        const inc=att-cor;
        const label=att===0?'Not started yet':`${cor} correct · ${inc} incorrect · ${100-att} unseen`;
        return `<a href="practice.html?topic=${encodeURIComponent(t.id)}" class="topic-card">
          <div class="topic-name">${t.id}</div>
          <div class="topic-count">${label}</div>
          <div class="tp-bar">
            ${cor>0?`<div class="tp-correct" style="width:${cor}%"></div>`:''}
            ${inc>0?`<div class="tp-incorrect" style="width:${inc}%"></div>`:''}
          </div>
        </a>`;
      }).join('')}
  </div>
`
}

init();


</script>
</body>
</html>
