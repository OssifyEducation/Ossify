<style>

/* HERO BANNER */

.streak-dots{display:flex;align-items:center;gap:5px;margin-bottom:9px;}
.s-dot{min-width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;letter-spacing:.3px;padding:0 6px;}
.sd-on{background:rgba(255,255,255,0.28);color:#fff;}
.sd-today{background:#fff;color:var(--pu-dark);box-shadow:0 0 0 2px rgba(255,255,255,0.5);}
.sd-today-empty{background:rgba(255,255,255,0.08);border:1.5px dashed rgba(255,255,255,0.4);color:rgba(255,255,255,0.5);}

.sd-future{background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.1);}

/* TOPIC BARS */
.tp-bar{height:6px;background:rgba(255,255,255,0.08);border-radius:6px;overflow:hidden;margin-top:8px;display:flex;}
.tp-correct{background:#22c55e;height:100%;border-radius:6px 0 0 6px;transition:width .4s ease;}
.tp-incorrect{background:#ef4444;height:100%;transition:width .4s ease;}
.tp-correct:last-child,.tp-correct:only-child{border-radius:6px;}

/* FORM */

.topic-card{background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:10px;padding:12px;text-decoration:none;display:block;transition:all 0.15s;}

.topic-count{font-size:10.5px;color:var(--muted);margin-bottom:6px;}
.badges-wrap{display:flex;flex-wrap:wrap;gap:10px;}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:3px;}
.badge-ico-wrap{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.badge-ico-wrap svg{width:18px;height:18px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.badge-name{font-size:9px;color:var(--muted);text-align:center;max-width:60px;line-height:1.3;}
.badge-item.locked .badge-ico-wrap{filter:grayscale(1);opacity:0.25;}

/* Timed exam card */
.tx-card{margin-bottom:14px;}
.tx-body{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:16px 18px;}
.tx-score{font-family:var(--font-serif);font-size:38px;font-weight:300;line-height:1;color:var(--pu-dark);font-variant-numeric:tabular-nums;letter-spacing:-1px;}
.tx-score small{font-size:18px;color:var(--pu-light);margin-left:3px;letter-spacing:0;}
.tx-meta{font-size:12.5px;color:var(--muted);line-height:1.6;}
.tx-meta b{color:var(--pu-dark);font-weight:600;}
.tx-hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.tx-hist a{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--pu-pale);color:var(--pu-dark);text-decoration:none;border:0.5px solid var(--lav-border);transition:all .15s;}
.tx-hist a:hover{background:#e0d5fc;}
.tx-live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--red);}
.tx-live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);}
.tx-cta{transition:transform .18s,box-shadow .18s,background-color .18s;}
.tx-cta:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(61,31,122,.2);}
@media(max-width:700px){.tx-body{grid-template-columns:1fr;gap:12px;}}

/* ── Step 3: insights ── */
.rings{display:flex;gap:28px;justify-content:center;padding:4px 0 12px;flex-wrap:wrap;}
.ring{position:relative;display:flex;flex-direction:column;align-items:center;width:120px;}
.ring svg{display:block;}
.ring-txt{position:absolute;top:0;left:0;right:0;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-big{font-family:var(--font-serif);font-size:22px;color:var(--pu-dark);font-variant-numeric:tabular-nums;line-height:1;}
.ring-small{font-size:10.5px;color:var(--muted);margin-top:3px;}
.ring-lbl{font-size:12px;font-weight:500;color:var(--ink);margin-top:6px;text-align:center;}
.trend-empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 10px 12px;}
.te-line{width:100%;height:0;border-top:1.5px dashed var(--lav-border);}
.te-txt{font-size:12.5px;color:var(--muted);text-align:center;max-width:46ch;line-height:1.55;}
.ring-arc{transition:stroke-dasharray .9s cubic-bezier(.2,.7,.2,1);}
.ins-note{font-size:12px;color:var(--muted);line-height:1.55;padding-top:8px;border-top:0.5px solid var(--lav-border);}
.next-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:0.5px solid var(--lav-border);text-decoration:none;color:inherit;border-radius:8px;transition:background-color .15s;}
.next-item:last-of-type{border-bottom:none;}
.next-item:hover{background:var(--pu-ultra);}
.next-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.next-dot.focus{background:var(--pk-mid);} .next-dot.cover{background:var(--pu-light);}
.next-txt{flex:1;min-width:0;display:flex;flex-direction:column;}
.next-name{font-size:13px;font-weight:600;color:var(--pu-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.next-why{font-size:11.5px;color:var(--muted);margin-top:1px;}
.next-go{font-size:12px;font-weight:600;color:var(--pu-mid);white-space:nowrap;}
.trend-wrap{width:100%;}
.trend-svg{width:100%;height:150px;display:block;}
.trend-svg .ax{font-size:9.5px;fill:var(--muted);font-family:var(--font-sans);}
.trend-svg .ax-acc{fill:var(--teal-d);}
.trend-legend{display:flex;gap:14px;font-size:11px;color:var(--muted);align-items:center;}
.trend-legend span{display:flex;align-items:center;gap:6px;}
.lg-bar{width:10px;height:10px;border-radius:2px;background:var(--pu-light);display:inline-block;}
.lg-line{width:14px;height:2px;background:var(--teal-d);display:inline-block;}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin-bottom:10px;}
.st-tile{display:flex;flex-direction:column;gap:3px;padding:13px 14px 12px;border-radius:13px;border:0.5px solid var(--lav-border);background:var(--lav-card);text-decoration:none;color:inherit;transition:transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .18s;}
.st-tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(61,31,122,.45);}
.st-name{font-size:12px;font-weight:600;color:var(--pu-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-acc{font-family:var(--font-serif);font-size:26px;line-height:1.1;color:var(--pu-dark);font-variant-numeric:tabular-nums;}
.st-acc small{font-family:var(--font-sans);font-size:12px;color:var(--muted);margin-left:2px;}
.st-band{font-size:11px;font-weight:600;letter-spacing:.2px;}
.st-cov{height:4px;border-radius:4px;background:rgba(61,31,122,.08);overflow:hidden;margin-top:5px;}
.st-cov span{display:block;height:100%;background:var(--pu-mid);border-radius:4px;}
.st-meta{font-size:10.5px;color:var(--muted);}
.st-strong{background:#ecfdf5;border-color:#a7f3d0;} .st-strong .st-band{color:#166534;}
.st-good{background:#f0fdfa;border-color:#99f6e4;}   .st-good .st-band{color:var(--teal-d);}
.st-fair{background:#fffbeb;border-color:#fde68a;}   .st-fair .st-band{color:#92400e;}
.st-focus{background:var(--pk-pale);border-color:var(--pk-border);} .st-focus .st-band{color:#9b2058;}
.st-early .st-band,.st-none .st-band{color:var(--muted);}
.st-none .st-acc{color:var(--muted);}
.st-key{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--muted);margin-bottom:18px;}
.st-key span{display:flex;align-items:center;gap:6px;}
.st-key i{width:12px;height:12px;border-radius:3px;border:0.5px solid var(--lav-border);display:inline-block;}
.st-key i.st-early{background:var(--lav-card);}
@media (prefers-reduced-motion:reduce){.ring-arc,.st-tile{transition:none;}}
</style>

function streakDots(streak){
  // Show Mon–Sun of the current week.
  // Work backwards from today by `streak` days — any slot within that range lights up.
  // Broken streak → streak resets to ≤1, so only today (or nothing) is lit.
  const labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dow=new Date().getDay();          // 0=Sun … 6=Sat
  const todayIdx=dow===0?6:dow-1;        // 0=Mon … 6=Sun
  return labels.map((label,i)=>{
    const isFuture=i>todayIdx;
    const daysAgo=todayIdx-i;             // 0=today, 1=yesterday, …
    const inStreak=!isFuture&&daysAgo<streak;
    const isToday=i===todayIdx;
    let cls;
    if(isFuture)           cls='sd-future';
    else if(inStreak&&isToday) cls='sd-today';
    else if(inStreak)      cls='sd-on';
    else if(isToday)       cls='sd-today-empty';
    else                   cls='sd-off';
    return`<div class="s-dot ${cls}">${label}</div>`;
  }).join('');
}

const escD=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SHORT={'Infectious Disease / Haematology / Immunology / Allergies / Genetics':'Infection / Haem / Immunology','Gastroenterology / Nutrition':'Gastro / Nutrition','Endocrinology / Metabolic':'Endocrine / Metabolic','Pharmacology & Therapeutics':'Pharmacology','Dermatology / ENT / Eyes':'Derm / ENT / Eyes','Psychiatry / Neurology':'Psychiatry / Neuro'};
const MIN_FOR_ACC=5;
function band(t){
  if(!t.attempted) return {key:'none',label:'Not started'};
  if(t.attempted<MIN_FOR_ACC) return {key:'early',label:'Early data'};
  const a=t.correct/t.attempted*100;
  if(a>=80) return {key:'strong',label:'Strong'};
  if(a>=65) return {key:'good',label:'Good'};
  if(a>=50) return {key:'fair',label:'Building'};
  return {key:'focus',label:'Focus area'};
}
function ring(pct,big,small,label,color){
  const r=34,c=2*Math.PI*r,v=Math.max(0,Math.min(100,pct));
  return `<div class="ring" role="img" aria-label="${escD(label)}: ${escD(big)}${small?' '+escD(small):''}">
    <svg viewBox="0 0 84 84" width="96" height="96" aria-hidden="true">
      <circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--pu-pale)" stroke-width="8"/>
      ${v>0?`<circle class="ring-arc" cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="${(c*v/100).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 42 42)"/>`:''}
    </svg>
    <div class="ring-txt"><div class="ring-big">${escD(big)}</div>${small?`<div class="ring-small">${escD(small)}</div>`:''}</div>
    <div class="ring-lbl">${escD(label)}</div></div>`;
}
function trendSvg(daily){
  const W=640,H=150,P={l:26,r:34,t:12,b:22};
  const n=daily.length, maxA=Math.max(5,...daily.map(d=>d.answered));
  const bw=(W-P.l-P.r)/n;
  const y=v=>P.t+(H-P.t-P.b)*(1-v/maxA);
  const ya=v=>P.t+(H-P.t-P.b)*(1-v/100);
  const bars=daily.map((d,i)=>{const h=(H-P.t-P.b)*d.answered/maxA;
    return `<rect x="${(P.l+i*bw+bw*0.18).toFixed(1)}" y="${(H-P.b-h).toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${d.answered?'var(--pu-light)':'var(--pu-pale)'}"><title>${escD(fmtDay(d.day))}: ${d.answered} answered${d.answered?`, ${Math.round(d.correct/d.answered*100)}% correct`:''}</title></rect>`;}).join('');
  const pts=daily.map((d,i)=>d.answered>=3?[P.l+i*bw+bw/2, ya(d.correct/d.answered*100)]:null).filter(Boolean);
  const line=pts.length>1?`<polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--teal-d)" stroke-width="2" stroke-linejoin="round"/>`:'';
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="var(--teal-d)" stroke-width="2"/>`).join('');
  const ticks=[0,Math.round(maxA/2),maxA].map(v=>`<text x="${P.l-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" class="ax">${v}</text>`).join('');
  const yr=pts.length?[0,50,100].map(v=>`<text x="${W-P.r+6}" y="${(ya(v)+3).toFixed(1)}" class="ax ax-acc">${v}%</text>`).join(''):'';
  const xl=[0,Math.floor(n/2),n-1].map(i=>`<text x="${(P.l+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" class="ax">${escD(fmtDay(daily[i].day,true))}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="trend-svg" preserveAspectRatio="none" aria-hidden="true"><line x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}" stroke="var(--lav-border)"/>${bars}${line}${dots}${ticks}${yr}${xl}</svg>`;
}
function fmtDay(iso,short){const d=new Date(iso+'T00:00:00Z');return d.toLocaleDateString('en-GB',short?{day:'numeric',month:'short',timeZone:'UTC'}:{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});}
function renderInsights(ins, fallback){
  if(!ins){return `<div class="card" style="margin-bottom:14px"><div class="card-body" style="font-size:13px;color:var(--muted)">Your progress insights couldn’t be loaded just now. Refresh to try again.</div></div>`;}

  const ans=Number(T.answered)||0, cor=Number(T.correct)||0, bank=Number(T.bank_total)||0;
  const acc=ans?Math.round(cor/ans*100):0;
  const topics=(ins.topics||[]).map(t=>({topic:t.topic,bank:Number(t.bank_total),attempted:Number(t.attempted),correct:Number(t.correct)}));
  const daily=(ins.daily||[]).map(d=>({day:d.day,answered:Number(d.answered),correct:Number(d.correct)}));
  // ── progress card
  const plat=ins.platform;
  const platLine=plat
    ? `<div class="vs-delta ${acc>=plat.avg_accuracy?'good':'bad'}">Ossify average: ${plat.avg_accuracy}% across ${plat.doctors} doctors with 20+ answers</div>`
    : `<div class="ins-note">A platform comparison appears once at least 5 other doctors have answered 20+ questions.</div>`;
  const progress=`<div class="card"><div class="card-hdr"><div><div class="card-title"><svg viewBox="0 0 24 24" style="stroke:var(--pu-mid);"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>Your progress</div><div class="card-sub">Across the full question bank</div></div></div>
    <div class="card-body"><div class="rings">
      ${ring(bank?ans/bank*100:0, ans.toLocaleString('en-GB'), 'of '+bank.toLocaleString('en-GB'), 'Questions answered', 'var(--pu-mid)')}
      ${ring(acc, ans?acc+'%':'—', ans?cor+' correct':'', 'First-attempt accuracy', 'var(--teal-d)')}
    </div>${platLine}</div></div>`;
  // ── what to practise next
  const withEnough=topics.filter(t=>t.attempted>=MIN_FOR_ACC).sort((a,b)=>a.correct/a.attempted-b.correct/b.attempted||b.attempted-a.attempted);
  const recs=[];
  if(withEnough.length){const w=withEnough[0];recs.push({t:w.topic,why:`Lowest accuracy: ${Math.round(w.correct/w.attempted*100)}% across ${w.attempted} questions`,kind:'focus'});}
  const coverage=[...topics].sort((a,b)=>a.attempted/a.bank-b.attempted/b.bank||a.topic.localeCompare(b.topic));
  for(const c of coverage){ if(recs.length>=3) break; if(recs.some(r=>r.t===c.topic)) continue;
    recs.push({t:c.topic,why:c.attempted?`Least practised: ${c.attempted} of ${c.bank} answered`:`Not started: ${c.bank} questions waiting`,kind:'cover'}); }
  const next=`<div class="card"><div class="card-hdr"><div><div class="card-title"><svg viewBox="0 0 24 24" style="stroke:var(--pk-mid);"><polyline points="9 18 15 12 9 6"/></svg>What to practise next</div><div class="card-sub">${ans?'Chosen from your answers so far':'Good places to start'}</div></div></div>

        <span class="next-dot ${r.kind}" aria-hidden="true"></span>
        <span class="next-txt"><span class="next-name">${escD(r.t)}</span><span class="next-why">${escD(r.why)}</span></span>
        <span class="next-go">Practise →</span></a>`).join('')}
      ${withEnough.length?'':`<div class="ins-note">Answer at least ${MIN_FOR_ACC} questions in a specialty to see where your accuracy is weakest.</div>`}</div></div>`;
  // ── 30-day trend
  const tAns=daily.reduce((s,d)=>s+d.answered,0), tCor=daily.reduce((s,d)=>s+d.correct,0), act=daily.filter(d=>d.answered).length;
  const busiest=daily.reduce((m,d)=>d.answered>(m?.answered||0)?d:m,null);
  const summary=tAns?`${tAns} question${tAns===1?'':'s'} on ${act} day${act===1?'':'s'} · ${Math.round(tCor/tAns*100)}% correct${busiest?` · busiest: ${fmtDay(busiest.day)} (${busiest.answered})`:''}`:'No questions answered in the last 30 days yet.';
  const trend=`<div class="card" style="margin-bottom:14px"><div class="card-hdr"><div><div class="card-title"><svg viewBox="0 0 24 24" style="stroke:var(--pu-mid);"><polyline points="3 17 9 11 13 15 21 7"/></svg>Last 30 days</div><div class="card-sub">${escD(summary)}</div></div>
      ${tAns?`<div class="trend-legend" aria-hidden="true"><span><i class="lg-bar"></i>Questions answered</span><span><i class="lg-line"></i>Accuracy (days with 3+)</span></div>`:''}</div>
    <div class="card-body">${tAns?`<div class="trend-wrap" role="img" aria-label="${escD('Last 30 days: '+summary)}">${trendSvg(daily)}</div>`
      :`<div class="trend-empty"><div class="te-line" aria-hidden="true"></div><div class="te-txt">Your daily activity and accuracy will appear here once you start answering questions.</div></div>`}</div></div>`;
  // ── strength map
  const tiles=topics.map(t=>{const b=band(t);const accT=t.attempted?Math.round(t.correct/t.attempted*100):null;const cov=t.bank?Math.round(t.attempted/t.bank*100):0;
    return `<a class="st-tile st-${b.key}" href="practice.html?topic=${encodeURIComponent(t.topic)}" aria-label="${escD(t.topic)}: ${b.label}${accT!==null?', '+accT+'% correct':''}, ${t.attempted} of ${t.bank} answered">
      <span class="st-name" title="${escD(t.topic)}">${escD(SHORT[t.topic]||t.topic)}</span>
      <span class="st-acc">${accT!==null&&t.attempted>=MIN_FOR_ACC?accT+'%':accT!==null?accT+'%<small>*</small>':'—'}</span>
      <span class="st-band">${b.label}</span>
      <span class="st-cov" aria-hidden="true"><span style="width:${cov}%"></span></span>
      <span class="st-meta">${t.attempted} / ${t.bank} answered</span></a>`;}).join('');
  const map=`<div class="sec-row"><div class="sec-h">Specialty strength map</div><a href="practice.html" class="sec-a">Practise any specialty →</a></div>
    <div class="st-grid">${tiles}</div>
    <div class="st-key" aria-hidden="true"><span><i class="st-strong"></i>Strong ≥80%</span><span><i class="st-good"></i>Good 65–79%</span><span><i class="st-fair"></i>Building 50–64%</span><span><i class="st-focus"></i>Focus &lt;50%</span><span><i class="st-early"></i>* fewer than ${MIN_FOR_ACC} answered</span></div>`;
  return `<div class="two-col">${progress}${next}</div>${trend}${map}`;
}

init();


</script>
</body>
</html>
