<style>

/* HERO BANNER */

.s-dot{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;}

.sd-now{background:rgba(255,255,255,0.08);border:1.5px dashed rgba(255,255,255,0.25);color:rgba(255,255,255,0.4);}

/* TOPIC BARS */

.tp-fill{height:100%;border-radius:3px;}

/* FORM */

.topic-card{background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:10px;padding:12px;text-decoration:none;display:block;transition:all 0.15s;}

.topic-count{font-size:10.5px;color:var(--muted);margin-bottom:6px;}
.badges-wrap{display:flex;flex-wrap:wrap;gap:10px;}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:3px;}
.badge-ico-wrap{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.badge-ico-wrap svg{width:18px;height:18px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.badge-name{font-size:9px;color:var(--muted);text-align:center;max-width:60px;line-height:1.3;}
.badge-item.locked .badge-ico-wrap{filter:grayscale(1);opacity:0.25;}

.dl-hero{background:var(--pu-dark);border-radius:14px;padding:22px 28px;margin-bottom:18px;position:relative;overflow:hidden;}
.dl-hero::after{content:"";position:absolute;right:-10px;top:-10px;width:100px;height:100px;border-radius:50%;background:rgba(167,139,250,0.1);}
.dl-back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:rgba(255,255,255,0.45);text-decoration:none;margin-bottom:10px;transition:color 0.15s;}
.dl-back:hover{color:rgba(255,255,255,0.8);}
.dl-back svg{width:14px;height:14px;fill:none;stroke:rgba(255,255,255,0.45);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.dl-hero h2{font-family:var(--font-serif);font-size:24px;color:#fff;margin-bottom:6px;}
.dl-hero p{font-size:13px;color:rgba(255,255,255,0.38);line-height:1.65;max-width:520px;}
.dl-hero-meta{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap;}
.dl-pill{font-size:11px;font-weight:500;background:rgba(255,255,255,0.1);border:0.5px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.65);padding:4px 12px;border-radius:20px;}

.dl-progress-card{background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:12px;padding:16px 20px;margin-bottom:18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.dl-prog-stat{text-align:center;}
.dl-prog-val{font-family:var(--font-serif);font-size:26px;color:var(--pu-dark);font-weight:400;line-height:1;}
.dl-prog-lbl{font-size:11px;color:var(--muted);margin-top:3px;}
.dl-prog-sep{width:1px;height:36px;background:var(--lav-border);}
.dl-prog-bar-wrap{flex:1;min-width:160px;}
.dl-prog-bar-label{font-size:12px;color:var(--moss);margin-bottom:5px;}
.dl-prog-bar{height:6px;background:var(--pu-pale);border-radius:6px;overflow:hidden;}
.dl-prog-fill{height:100%;border-radius:6px;transition:width 0.5s ease;}

.dl-filter{display:flex;gap:3px;background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:10px;padding:3px;width:fit-content;margin-bottom:16px;}
.dl-filter-btn{padding:6px 16px;border-radius:8px;border:none;background:none;font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:all 0.15s;}
.dl-filter-btn.active{background:var(--pu-mid);color:#fff;}

.modules-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.module-row{background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:16px;text-decoration:none;transition:all 0.15s;}
.module-row:hover{border-color:var(--pu-light);transform:translateX(2px);}
.module-row.locked{opacity:0.5;cursor:not-allowed;pointer-events:none;}
.module-status-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.module-status-ico svg{width:17px;height:17px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.module-status-ico.not-started{background:var(--lav);border:1.5px solid var(--lav-border);}
.module-status-ico.not-started svg{stroke:var(--muted);}
.module-status-ico.in-progress{background:var(--pu-pale);border:1.5px solid var(--pu-light);}
.module-status-ico.in-progress svg{stroke:var(--pu-mid);}
.module-status-ico.complete{background:var(--pu-mid);}
.module-status-ico.complete svg{stroke:#fff;}
.module-row-info{flex:1;}
.module-row-title{font-size:14px;font-weight:600;color:var(--pu-dark);margin-bottom:3px;}
.module-row-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
.module-row-layer{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.4px;}
.module-row-layer.core{background:var(--pu-pale);color:var(--pu-mid);}
.module-row-layer.foundation{background:#e2f4e2;color:#1a4a1a;}
.module-row-layer.exam_sharp{background:var(--pk-pale);color:var(--red);}
.module-row-time{display:flex;align-items:center;gap:4px;}
.module-row-time svg{width:12px;height:12px;fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.module-row-arrow{color:var(--muted);}
.module-row-arrow svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.module-row:hover .module-row-arrow svg{stroke:var(--pu-mid);}

.module-stage-dots{display:flex;gap:4px;margin-top:6px;}
.stage-dot{width:7px;height:7px;border-radius:50%;background:var(--pu-pale);border:1px solid var(--lav-border);}
.stage-dot.done{background:var(--pu-mid);border-color:var(--pu-mid);}
.stage-dot.active{background:var(--pu-light);border-color:var(--pu-light);}

.dl-empty{background:var(--lav-card);border:0.5px solid var(--lav-border);border-radius:12px;padding:40px;text-align:center;}
.dl-empty h3{font-family:var(--font-serif);font-size:18px;color:var(--pu-dark);margin-bottom:6px;}
.dl-empty p{font-size:13.5px;color:var(--muted);line-height:1.65;}

</style>

<script>
const SUPABASE_URL='https://judtpdikbidvccclftvq.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1ZHRwZGlrYmlkdmNjY2xmdHZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NTQ2NDMsImV4cCI6MjA5MTEzMDY0M30.GyS7rKKWnmXf5fbqrdSkuszrZ31xOqY5Will3C2J0WA';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function signOut(){sb.auth.signOut().then(()=>window.location.href='login.html');}

function setUserInfo(name, username){
  const i=ossifyInitials(name);
  document.getElementById('userAv').textContent=i;
  document.getElementById('userName').textContent=name||'';
  if(username)document.getElementById('userUsername').textContent='@'+username;
}
function updateTopbar(profile){
  const streak=profile?.current_streak||0, xp=profile?.xp||0;
  const el=document.getElementById('topbarStreak');
  const ex=document.getElementById('topbarXp');
  if(el)el.innerHTML=`<svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:none;stroke:#9b2058;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> ${streak} day`;
  if(ex)ex.innerHTML=`<svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:none;stroke:#3d1f7a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${xp} XP`;
  document.getElementById('sidebarStreak').innerHTML=`<svg viewBox="0 0 24 24" style="width:11px;height:11px;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> ${streak} day streak`;
}


const STAGES=['why','mechanism','clinical_picture','test_yourself','reasoning_case'];
let myId=null, domainData=null, modules=[], progByModule={}, filterLayer='all';

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return;}
  myId=session.user.id;

  const{data:profile}=await sb.from('profiles').select('*').eq('id',myId).single();
  updateTopbar(profile);
  setUserInfo(ossifyDisplayName(profile, session.user), profile?.username);

  // Get slug from URL
  const params=new URLSearchParams(window.location.search);
  const slug=params.get('slug');
  if(!slug){window.location.href='../domains.html';return;}

  // Load domain
  const{data:domain}=await sb.from('domains')
    .select('*').eq('slug',slug).single();
  if(!domain){window.location.href='../domains.html';return;}
  domainData=domain;

  // Load published modules for this domain
  const{data:mods}=await sb.from('modules')
    .select('id,slug,title,difficulty_layer,estimated_minutes,course_week,course_position')
    .eq('domain_id',domain.id)
    .eq('is_published',true)
    .order('course_week',{ascending:true,nullsFirst:false})
    .order('course_position');
  modules=mods||[];

  // Load user progress for these modules
  if(modules.length){
    const modIds=modules.map(m=>m.id);
    const{data:prog}=await sb.from('user_module_progress')
      .select('module_id,status,stages_completed,current_stage')
      .eq('user_id',myId)
      .in('module_id',modIds);
    (prog||[]).forEach(p=>{progByModule[p.module_id]=p;});
  }

  renderHero();
  renderProgress();
  renderModules();
}

function renderHero(){
  const d=domainData;
  document.getElementById('dlHero').style.borderTop=`4px solid ${d.colour_hex}`;
  document.getElementById('dlDomainName').textContent=d.name;
  document.getElementById('dlDomainDesc').textContent=d.description||'';
  document.getElementById('dlBack').href='../domains.html';
  document.getElementById('dlModCount').textContent=`${modules.length} module${modules.length!==1?'s':''}`;
  const typeLabel=d.type==='pdp'?'Professional Dilemmas':'Clinical Problem Solving';
  document.getElementById('dlTypeLabel').textContent=typeLabel;
}

function renderProgress(){
  const done=modules.filter(m=>progByModule[m.id]?.status==='complete').length;
  const inProg=modules.filter(m=>progByModule[m.id]?.status==='in_progress').length;
  const pct=modules.length>0?Math.round((done/modules.length)*100):0;
  const d=domainData;

  document.getElementById('dlProgressCard').innerHTML=`
    <div class="dl-prog-stat"><div class="dl-prog-val">${done}</div><div class="dl-prog-lbl">Complete</div></div>
    <div class="dl-prog-sep"></div>
    <div class="dl-prog-stat"><div class="dl-prog-val">${inProg}</div><div class="dl-prog-lbl">In progress</div></div>
    <div class="dl-prog-sep"></div>
    <div class="dl-prog-stat"><div class="dl-prog-val">${modules.length-done-inProg}</div><div class="dl-prog-lbl">Not started</div></div>
    <div class="dl-prog-sep"></div>
    <div class="dl-prog-bar-wrap">
      <div class="dl-prog-bar-label">${pct}% of ${d.name} complete</div>
      <div class="dl-prog-bar">
        <div class="dl-prog-fill" style="width:${pct}%;background:${d.colour_hex};"></div>
      </div>
    </div>`;
}

function setFilter(layer){
  filterLayer=layer;
  document.querySelectorAll('.dl-filter-btn').forEach((b,i)=>
    b.classList.toggle('active',['all','foundation','core','exam_sharp'][i]===layer));
  renderModules();
}

function renderModules(){
  const el=document.getElementById('modulesList');
  const filtered=filterLayer==='all'?modules:modules.filter(m=>m.difficulty_layer===filterLayer);

  if(!filtered.length&&modules.length){
    el.innerHTML=`<div class="dl-empty"><h3>No modules at this level</h3><p>Try a different filter.</p></div>`;
    return;
  }
  if(!modules.length){
    el.innerHTML=`<div class="dl-empty">
      <h3>Modules coming soon</h3>
      <p>${domainData.name} content is being authored. Check back soon.</p>
    </div>`;
    return;
  }

  const STATUS_ICONS={
    complete:`<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
    in_progress:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
    not_started:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  };

  el.innerHTML=filtered.map(m=>{
    const prog=progByModule[m.id];
    const status=prog?.status||'not_started';
    const stagesDone=prog?.stages_completed||[];
    const currentStage=prog?.current_stage||'why';
    const layerLabel=m.difficulty_layer==='core'?'Core MSRA':m.difficulty_layer==='foundation'?'Foundation':'Exam Sharp';

    const stageDots=STAGES.map(s=>{
      let cls='stage-dot';
      if(stagesDone.includes(s)) cls+=' done';
      else if(s===currentStage&&status==='in_progress') cls+=' active';
      return `<div class="${cls}" title="${s.replace('_',' ')}"></div>`;
    }).join('');

    const actionLabel=status==='complete'?'Review':status==='in_progress'?'Continue':'Start';

    return `<a class="module-row" href="module.html?slug=${m.slug}&from=domains">
      <div class="module-status-ico ${status.replace('_','-')}">
        ${STATUS_ICONS[status]||STATUS_ICONS.not_started}
      </div>
      <div class="module-row-info">
        <div class="module-row-title">${m.title}</div>
        <div class="module-row-meta">
          <span class="module-row-layer ${m.difficulty_layer}">${layerLabel}</span>
          <span class="module-row-time">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${m.estimated_minutes} min
          </span>
          ${m.course_week?`<span>Week ${m.course_week}</span>`:''}
        </div>
        <div class="module-stage-dots">${stageDots}</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;">
        <span style="font-size:12.5px;font-weight:500;color:${status==='complete'?'var(--pu-mid)':status==='in_progress'?'var(--pu-mid)':'var(--muted)'};">${actionLabel}</span>
        <div class="module-row-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
    </a>`;
  }).join('');
}

init();

</script>
</body>
</html>
