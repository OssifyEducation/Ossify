<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ossify — Tutor Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0f1f38;--navy-mid:#1a3356;--navy-light:#243f6a;
  --cream:#f8f5f0;--white:#ffffff;--gold:#c9962a;
  --gold-light:#f5e8c8;--gold-faint:#fdf8ee;
  --cyan-hl:#cff3f3;--cyan-hl-border:#4bb8c4;--cyan-dark:#0e7a85;
  --yellow-hl:#fef4c0;--yellow-hl-border:#d4a017;--yellow-dark:#8a6200;
  --correct:#1a6b3c;--correct-bg:#edf7f2;--correct-border:#5cb88a;
  --wrong:#8b2e2e;--wrong-bg:#fdf0f0;--wrong-border:#e08080;
  --text:#1a1a2e;--text-muted:#5a6070;--border:#dde3ed;
  --radius:10px;--shadow:0 2px 12px rgba(15,31,56,0.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#eef1f7;color:var(--text);min-height:100vh;line-height:1.6}

/* TOPBAR */
.topbar{background:var(--navy);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.3)}
.logo{font-family:'Libre Baskerville',serif;font-size:1.35rem;color:#fff;letter-spacing:.02em}
.logo-dot{color:var(--gold)}
.mode-badge{background:var(--gold);color:var(--navy);font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 12px;border-radius:20px}
.nav-meta{font-size:.78rem;color:rgba(255,255,255,.5);letter-spacing:.04em}
.page-wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}

/* LOADING */
.loading-state{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* CARD */
.card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px}

/* Q-HEADER */
.q-header{padding:20px 26px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.q-id{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.q-title{font-family:'Libre Baskerville',serif;font-size:1.05rem;color:var(--navy);margin-top:4px}
.q-tags{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.tag{font-size:.7rem;font-weight:500;padding:3px 10px;border-radius:4px;letter-spacing:.04em}
.tag-domain{background:#e8edf8;color:var(--navy-mid)}
.tag-type{background:var(--gold-light);color:var(--yellow-dark)}

/* COLOUR KEY */
.colour-key{padding:14px 20px;display:flex;gap:24px;flex-wrap:wrap;transition:opacity .4s}
body:not(.revealed) .colour-key{opacity:0;pointer-events:none;user-select:none}
.key-item{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-muted)}
.key-swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0}
.swatch-yellow{background:var(--yellow-hl);border:1.5px solid var(--yellow-hl-border)}
.swatch-cyan{background:var(--cyan-hl);border:1.5px solid var(--cyan-hl-border)}

/* OPTION LIST (EMQ) */
.option-list-card{padding:20px 26px}
.option-list-label{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px}
.option-list-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.option-list-item{display:flex;align-items:baseline;gap:8px;font-size:.88rem;color:var(--text);padding:4px 0}
.option-list-letter{font-weight:700;color:var(--navy-mid);flex-shrink:0;width:16px}

/* STEM */
.stem-card{padding:28px 30px}
.stem-label{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
.stem-text{font-size:1.02rem;line-height:1.8;color:var(--text);font-family:'Libre Baskerville',serif}

/* HIGHLIGHTS */
.hl{position:relative;border-radius:3px;transition:background .35s,border-bottom-color .35s,color .35s,filter .15s}
body:not(.revealed) .hl{cursor:default;padding:0}
body.revealed .hl{padding:1px 3px;cursor:pointer}
body.revealed .hl:hover{filter:brightness(.92)}
body.revealed .hl-yellow{background:var(--yellow-hl);border-bottom:2px solid var(--yellow-hl-border);color:var(--yellow-dark)}
body.revealed .hl-cyan{background:var(--cyan-hl);border-bottom:2px solid var(--cyan-hl-border);color:var(--cyan-dark)}

/* TOOLTIP */
.tooltip-wrap{display:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);z-index:200;width:300px;pointer-events:none}
body.revealed .hl:hover .tooltip-wrap{display:block}
.tooltip-box{background:var(--navy);color:#e8ecf4;font-size:.8rem;font-family:'DM Sans',sans-serif;font-weight:400;line-height:1.55;padding:12px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tooltip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--navy)}
.tooltip-type{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.tt-yellow .tooltip-type{color:var(--gold)}
.tt-cyan .tooltip-type{color:#6dd9e2}

/* SELECTABLE OPTIONS */
.options-card{padding:24px 26px}
.options-label{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
.option-item{display:flex;align-items:flex-start;gap:14px;padding:12px 16px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:border-color .18s,background .18s;user-select:none}
.option-item:last-child{margin-bottom:0}
.option-item:not(.submitted):hover{border-color:var(--navy-light);background:#f5f7fc}
.option-item.selected{border-color:var(--navy);background:#eef2fb}
.option-item.correct-ans{border-color:var(--correct-border);background:var(--correct-bg)}
.option-item.wrong-ans{border-color:var(--wrong-border);background:var(--wrong-bg)}
.option-item.neutral-reveal{border-color:#c5ccd9;background:#f9fafb}
.opt-letter{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:var(--text-muted);flex-shrink:0;transition:all .18s;margin-top:1px}
.option-item.selected .opt-letter{border-color:var(--navy);background:var(--navy);color:#fff}
.option-item.correct-ans .opt-letter{border-color:var(--correct);background:var(--correct);color:#fff}
.option-item.wrong-ans .opt-letter{border-color:var(--wrong);background:var(--wrong);color:#fff}
.opt-text{font-size:.93rem;line-height:1.5;padding-top:4px;color:var(--text);flex:1}
.opt-badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:4px;margin-left:auto;white-space:nowrap;flex-shrink:0;align-self:center}
.badge-correct-mark{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct-border)}
.badge-wrong-mark{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong-border)}

/* SUBMIT */
.submit-wrap{display:flex;align-items:center;gap:16px;margin-bottom:32px}
.btn-submit{background:var(--navy);color:#fff;border:none;padding:13px 36px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.92rem;font-weight:600;letter-spacing:.03em;cursor:pointer;transition:background .18s,transform .1s}
.btn-submit:hover:not(:disabled){background:var(--navy-light)}
.btn-submit:active:not(:disabled){transform:scale(.98)}
.btn-submit:disabled{background:#b0b8c9;cursor:not-allowed}
.submit-hint{font-size:.8rem;color:var(--text-muted)}

/* REVEAL */
#reveal-section{display:none}
#reveal-section.visible{display:block}

/* RESULT BANNER */
.result-banner{border-radius:var(--radius);padding:18px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;font-size:.95rem;box-shadow:var(--shadow)}
.result-banner.correct-banner{background:var(--correct-bg);border:1.5px solid var(--correct-border);color:var(--correct)}
.result-banner.wrong-banner{background:var(--wrong-bg);border:1.5px solid var(--wrong-border);color:var(--wrong)}
.result-icon{font-size:1.4rem}
.result-text strong{display:block;font-size:1rem;margin-bottom:2px}
.result-text span{font-size:.85rem;opacity:.85}

/* SECTION CARD */
.section-card{padding:26px 28px;margin-bottom:20px}
.section-title{font-family:'Libre Baskerville',serif;font-size:.95rem;font-weight:700;color:var(--navy);margin-bottom:18px;display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1.5px solid var(--border)}

/* ANSWER BLOCKS */
.answer-block{border:1.5px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden}
.answer-header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#fafbfd}
.ans-letter-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
.badge-c{background:var(--correct-bg);color:var(--correct);border:2px solid var(--correct-border)}
.badge-w{background:var(--wrong-bg);color:var(--wrong);border:2px solid var(--wrong-border)}
.ans-summary{font-size:.88rem;line-height:1.5;flex:1;color:var(--text)}
.ans-label{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.label-correct{color:var(--correct)}
.label-wrong{color:var(--wrong)}
.btn-detail{background:var(--navy);color:#fff;border:none;padding:7px 16px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s;letter-spacing:.02em}
.btn-detail:hover{background:var(--navy-light)}
.ans-detail-body{display:none;padding:16px 20px;font-size:.85rem;line-height:1.75;color:#3a4155;border-top:1px solid var(--border);background:#fff}
.ans-detail-body.open{display:block}
.ans-detail-body p{margin-bottom:10px}
.ans-detail-body p:last-child{margin-bottom:0}

/* CLUE ROWS */
.clue-row{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid #f0f2f6;cursor:pointer}
.clue-row:last-child{border-bottom:none}
.clue-tag{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.clue-tag-yellow{background:var(--yellow-hl);color:var(--yellow-dark);border:1px solid var(--yellow-hl-border)}
.clue-tag-cyan{background:var(--cyan-hl);color:var(--cyan-dark);border:1px solid var(--cyan-hl-border)}
.clue-label{font-size:.88rem;font-weight:600;color:var(--text);flex:1;min-width:0}
.clue-chevron{color:var(--text-muted);font-size:.75rem;transition:transform .22s;margin-top:3px;flex-shrink:0}
.clue-row.open .clue-chevron{transform:rotate(90deg)}
.clue-detail{display:none;font-size:.85rem;line-height:1.65;color:#3a4155;padding:12px 14px;background:var(--cream);border-radius:6px;margin:8px 0 4px;border-left:3px solid var(--yellow-hl-border)}
.clue-detail.cyan-detail{border-left-color:var(--cyan-hl-border)}
.clue-row.open + .clue-detail{display:block}

/* SUMMARY */
.summary-box{background:var(--gold-faint);border:1.5px solid #e8c96a;border-radius:var(--radius);padding:22px 26px;margin-bottom:20px}
.summary-title{font-family:'Libre Baskerville',serif;font-size:.95rem;font-weight:700;color:var(--yellow-dark);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.summary-list{list-style:none}
.summary-list li{font-size:.85rem;line-height:1.6;padding:7px 0 7px 18px;border-bottom:1px solid #f0e0a0;position:relative;color:#4a3800}
.summary-list li:last-child{border-bottom:none}
.summary-list li::before{content:'▸';position:absolute;left:0;color:var(--gold);font-size:.75rem;top:9px}

/* REFS */
.refs-card{padding:22px 26px}
.refs-title{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:10px}
.ref-item{font-size:.78rem;color:var(--text-muted);line-height:1.6;padding:5px 0;border-bottom:1px solid #f2f4f8;display:flex;gap:10px}
.ref-item:last-child{border-bottom:none}
.ref-num{font-weight:700;color:var(--navy-mid);flex-shrink:0}

@media(max-width:600px){
  .q-header{flex-direction:column;gap:10px}
  .topbar{padding:0 16px}
  .page-wrap{padding:18px 12px 60px}
  .option-list-grid{grid-template-columns:1fr}
  .answer-header{flex-wrap:wrap}
  .tooltip-wrap{width:240px}
}
</style>
</head>
<body>
<nav class="topbar">
  <div class="logo">Ossify<span class="logo-dot">.</span></div>
  <span class="mode-badge">Tutor Mode</span>
  <span class="nav-meta" id="nav-qid"></span>
</nav>
<div class="page-wrap">
  <div id="loading" class="loading-state">
    <div class="spinner"></div>
    <span style="color:var(--text-muted);font-size:.9rem">Loading question…</span>
  </div>
  <div id="error-state" style="display:none;padding:48px;text-align:center;color:var(--wrong);font-size:.95rem"></div>
  <div id="question-root" style="display:none"></div>
</div>

<script>
const SUPA_URL = 'https://judtpdikbidvccclftvq.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1ZHRwZGlrYmlkdmNjY2xmdHZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NTQ2NDMsImV4cCI6MjA5MTEzMDY0M30.GyS7rKKWnmXf5fbqrdSkuszrZ31xOqY5Will3C2J0WA';

const ST = { selected:null, submitted:false, correct:null, letters:[] };

/* ── INIT ── */
async function init() {
  const p = new URLSearchParams(location.search);
  let url = `${SUPA_URL}/rest/v1/questions?select=*`;
  if (p.get('question_id'))   url += `&question_id=eq.${encodeURIComponent(p.get('question_id'))}`;
  else if (p.get('id'))       url += `&id=eq.${encodeURIComponent(p.get('id'))}`;
  else                        url += '&order=id.asc&limit=1';
  try {
    const rows = await fetch(url,{headers:{apikey:SUPA_KEY,Authorization:`Bearer ${SUPA_KEY}`}}).then(r=>r.json());
    if (!rows.length) { showError('Question not found.'); return; }
    const row = rows[0];
    document.getElementById('loading').style.display='none';
    document.getElementById('nav-qid').textContent = row.question_id||'';
    row.type==='SBA' ? renderSBA(row) : row.type==='EMQ' ? renderEMQ(row) : showError('Unknown type: '+row.type);
  } catch(e){ showError('Could not load question — check your connection.'); console.error(e); }
}
function showError(m){
  document.getElementById('loading').style.display='none';
  const el=document.getElementById('error-state'); el.style.display='block'; el.textContent=m;
}

/* ── UTILS ── */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function parseClueStr(s){
  if(typeof s!=='string') return null;
  const m=s.match(/^"([^"]+)"\s*[—–\-]+\s*(.+)$/s);
  return m?{label:m[1].trim(),explanation:m[2].trim()}:null;
}

function briefFallback(det){
  if(!det) return '';
  const m=det.match(/^(.{40,350})\.\s/s);
  return m ? m[1].trim()+'.' : det.substring(0,200).trim();
}

function parseHighYield(t){
  if(!t) return [];
  return t.replace(/^Key Points to Memorise\s*/i,'').split(/•\s+/).map(s=>s.trim()).filter(s=>s.length>5);
}

function parseRefs(t){
  if(!t) return [];
  // split on newlines, handle [N] prefixes
  return t.split(/\n/).map(s=>s.trim()).filter(Boolean);
}

function parseSBAKeyContent(arr){
  if(!arr||!arr.length) return {clues:[],distractors:[]};
  const clues=[],distractors=[];
  let mode='clue';
  for(const item of arr){
    if(typeof item!=='string') continue;
    if(item.includes('cyan-highlighted')||item.toLowerCase().includes('why the cyan')){mode='distractor';continue;}
    if(!item.startsWith('"')) continue;
    const p=parseClueStr(item);
    if(!p) continue;
    (mode==='clue'?clues:distractors).push(p);
  }
  return {clues,distractors};
}

/* ── SHARED HTML BUILDERS ── */
function colourKeyHTML(){
  return `<div class="card colour-key">
    <div class="key-item"><div class="key-swatch swatch-yellow"></div><span><strong>Key diagnostic clue</strong> — hover to see why it matters</span></div>
    <div class="key-item"><div class="key-swatch swatch-cyan"></div><span><strong>Distractor</strong> — hover to see why it misleads</span></div>
  </div>`;
}

function clueRowHTML(c, type){
  const tc=type==='clue'?'clue-tag-yellow':'clue-tag-cyan';
  const tl=type==='clue'?'Clue':'Distractor';
  const dc=type==='distractor'?'clue-detail cyan-detail':'clue-detail';
  return `<div class="clue-row" onclick="toggleClue(this)">
    <div class="clue-tag ${tc}">${tl}</div>
    <div class="clue-label">"${esc(c.label)}"</div>
    <div class="clue-chevron">▶</div>
  </div><div class="${dc}">${esc(c.explanation)}</div>`;
}

function answerBlockHTML(opt, idx){
  const correct = opt.correct===true||opt.correct==='true';
  const letter  = opt.letter||String.fromCharCode(65+idx);
  const brief   = opt.brief||briefFallback(opt.detailed);
  const id      = 'det-'+letter;
  const bc      = correct?'badge-c':'badge-w';
  const lc      = correct?'label-correct':'label-wrong';
  const lt      = correct?'✓ Correct Answer':'✗ Incorrect';
  const paras   = opt.detailed ? opt.detailed.split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join('') : '';
  return `<div class="answer-block">
    <div class="answer-header">
      <div class="ans-letter-badge ${bc}">${esc(letter)}</div>
      <div class="ans-summary"><div class="ans-label ${lc}">${lt}</div>${esc(brief)||'<em style="color:var(--text-muted)">See detailed explanation</em>'}</div>
      ${paras?`<button class="btn-detail" onclick="toggleDetail('${id}',this)">Detailed Explanation</button>`:''}
    </div>
    ${paras?`<div class="ans-detail-body" id="${id}">${paras}</div>`:''}
  </div>`;
}

function highYieldHTML(t){
  const b=parseHighYield(t);
  if(!b.length) return '';
  return `<div class="summary-box"><div class="summary-title">⚡ High-Yield Summary</div><ul class="summary-list">${b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
}

function refsHTML(t){
  if(!t) return '';
  const lines=parseRefs(t).filter(l=>l.length>3);
  if(!lines.length) return '';
  const items=lines.map(l=>{
    const m=l.match(/^\[?(\d+)\]?\s*(.*)/s);
    return m?`<div class="ref-item"><span class="ref-num">[${m[1]}]</span><span>${esc(m[2])}</span></div>`
            :`<div class="ref-item"><span>${esc(l)}</span></div>`;
  }).join('');
  return `<div class="card refs-card"><div class="refs-title">References</div>${items}</div>`;
}

function cluesSectionHTML(arr, type, title, icon){
  if(!arr.length) return '';
  return `<div class="card section-card"><div class="section-title">${icon} ${title}</div>${arr.map(c=>clueRowHTML(c,type)).join('')}</div>`;
}

/* ── SBA RENDERER ── */
function renderSBA(row){
  const tc=row.tutor_content||{};
  const opts=(tc.options||[]).sort((a,b)=>(a.letter||'').localeCompare(b.letter||''));
  const correctOpt=opts.find(o=>o.correct===true||o.correct==='true');
  ST.correct=correctOpt?correctOpt.letter:'';
  ST.letters=opts.map(o=>o.letter||'');
  const {clues,distractors}=parseSBAKeyContent(tc.key_distractors||tc.key_clues||[]);
  const anns=tc.annotations||[];

  document.getElementById('question-root').innerHTML=`
    <div class="card q-header">
      <div>
        <div class="q-id">${esc(row.question_id)} · ${esc(row.domain||'')} · ${esc(row.topic||'')}</div>
        <div class="q-title">${esc(row.topic||'Single Best Answer')}</div>
      </div>
      <div class="q-tags"><span class="tag tag-domain">MSRA CPS</span><span class="tag tag-type">SBA</span></div>
    </div>
    ${anns.length?colourKeyHTML():''}
    <div class="card stem-card">
      <div class="stem-label">Clinical Vignette</div>
      <div class="stem-text" id="stem-text"></div>
    </div>
    <div class="card options-card">
      <div class="options-label">Select one answer</div>
      ${opts.map(o=>`<div id="opt-${o.letter}" class="option-item" onclick="selectOption('${o.letter}')"><div class="opt-letter">${o.letter}</div><div class="opt-text">${esc(o.label)}</div></div>`).join('')}
    </div>
    <div class="submit-wrap">
      <button class="btn-submit" id="submit-btn" onclick="submitAnswer()" disabled>Submit Answer</button>
      <span class="submit-hint" id="submit-hint">Select an answer to continue</span>
    </div>
    <div id="reveal-section">
      <div id="result-banner" class="result-banner"></div>
      <div class="card section-card"><div class="section-title">📝 Answer Explanations</div>${opts.map((o,i)=>answerBlockHTML(o,i)).join('')}</div>
      ${highYieldHTML(tc.high_yield_summary)}
      ${cluesSectionHTML(clues,'clue','Key Diagnostic Clues','🔑')}
      ${cluesSectionHTML(distractors,'distractor','Distractors — Why They Mislead','🔵')}
      ${refsHTML(tc.references)}
    </div>`;

  // Set stem as plain text (safe for annotation injection)
  document.getElementById('stem-text').textContent = row.stem||'';
  document.getElementById('question-root').style.display='block';
  if(anns.length) window.__anns=anns;
}

/* ── EMQ RENDERER ── */
function renderEMQ(row){
  const tc=row.tutor_content||{};
  const sc=tc.this_scenario||{};
  const ak=(sc.answer_key||[]).sort((a,b)=>(a.letter||'').localeCompare(b.letter||''));
  ST.correct=sc.correct_letter||'';
  ST.letters=ak.map(o=>o.letter||'');
  const clues=(sc.key_clues||[]).map(parseClueStr).filter(Boolean);
  const dists=(sc.distractors||[]).map(parseClueStr).filter(Boolean);
  const optList=tc.option_list||[];
  const anns=tc.annotations||[];

  const optListGrid=optList.map(item=>{
    const letter=item.charAt(0);
    const text=item.replace(/^[A-J]\.\s*/,'');
    return `<div class="option-list-item"><span class="option-list-letter">${esc(letter)}</span>${esc(text)}</div>`;
  }).join('');

  document.getElementById('question-root').innerHTML=`
    <div class="card q-header">
      <div>
        <div class="q-id">${esc(row.question_id)} · ${esc(row.domain||'')} · ${esc(tc.set_theme||row.topic||'')}</div>
        <div class="q-title">${esc(tc.set_theme||row.topic||'Extended Matching Question')}</div>
      </div>
      <div class="q-tags"><span class="tag tag-domain">MSRA CPS</span><span class="tag tag-type">EMQ</span></div>
    </div>
    ${anns.length?colourKeyHTML():''}
    ${optList.length?`<div class="card option-list-card"><div class="option-list-label">Answer Options</div><div class="option-list-grid">${optListGrid}</div></div>`:''}
    <div class="card stem-card">
      <div class="stem-label">Clinical Vignette</div>
      <div class="stem-text" id="stem-text"></div>
    </div>
    <div class="card options-card">
      <div class="options-label">Select one answer</div>
      ${ak.map(o=>`<div id="opt-${o.letter}" class="option-item" onclick="selectOption('${o.letter}')"><div class="opt-letter">${o.letter}</div><div class="opt-text">${esc(o.label)}</div></div>`).join('')}
    </div>
    <div class="submit-wrap">
      <button class="btn-submit" id="submit-btn" onclick="submitAnswer()" disabled>Submit Answer</button>
      <span class="submit-hint" id="submit-hint">Select an answer to continue</span>
    </div>
    <div id="reveal-section">
      <div id="result-banner" class="result-banner"></div>
      <div class="card section-card"><div class="section-title">📝 Answer Explanations</div>${ak.map((o,i)=>answerBlockHTML(o,i)).join('')}</div>
      ${highYieldHTML(tc.high_yield_summary)}
      ${cluesSectionHTML(clues,'clue','Key Diagnostic Clues','🔑')}
      ${cluesSectionHTML(dists,'distractor','Distractors — Why They Mislead','🔵')}
      ${refsHTML(tc.references)}
    </div>`;

  document.getElementById('stem-text').textContent = sc.stem||row.stem||'';
  document.getElementById('question-root').style.display='block';
  if(anns.length) window.__anns=anns;
}

/* ── INTERACTION ── */
function selectOption(letter){
  if(ST.submitted) return;
  ST.selected=letter;
  ST.letters.forEach(l=>document.getElementById('opt-'+l)?.classList.remove('selected'));
  document.getElementById('opt-'+letter)?.classList.add('selected');
  document.getElementById('submit-btn').disabled=false;
  document.getElementById('submit-hint').textContent='';
}

function submitAnswer(){
  if(!ST.selected||ST.submitted) return;
  ST.submitted=true;
  document.getElementById('submit-btn').disabled=true;
  const {selected:chosen,correct,letters}=ST;

  letters.forEach(l=>{
    const el=document.getElementById('opt-'+l);
    if(!el) return;
    el.onclick=null; el.classList.remove('selected'); el.classList.add('submitted');
    if(l===correct){
      el.classList.add('correct-ans');
      el.insertAdjacentHTML('beforeend','<span class="opt-badge badge-correct-mark">✓ Correct</span>');
    } else if(l===chosen){
      el.classList.add('wrong-ans');
      el.insertAdjacentHTML('beforeend','<span class="opt-badge badge-wrong-mark">✗ Your answer</span>');
    } else {
      el.classList.add('neutral-reveal');
    }
  });

  const banner=document.getElementById('result-banner');
  if(chosen===correct){
    banner.className='result-banner correct-banner';
    banner.innerHTML=`<span class="result-icon">✅</span><div class="result-text"><strong>Correct!</strong><span>Scroll down to see the full explanation.</span></div>`;
  } else {
    banner.className='result-banner wrong-banner';
    banner.innerHTML=`<span class="result-icon">❌</span><div class="result-text"><strong>Not quite.</strong><span>The correct answer is <strong>${esc(correct)}</strong>. Review the explanations below.</span></div>`;
  }

  document.getElementById('reveal-section').classList.add('visible');
  document.body.classList.add('revealed');

  if(window.__anns&&window.__anns.length) annotateStep(document.getElementById('stem-text'),window.__anns);
  setTimeout(()=>banner.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

/* ── ANNOTATIONS ── */
function annotateStep(el,anns){
  if(!el||!anns.length) return;
  // Work from plain text, build annotated HTML
  let html=el.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Sort longest first to avoid partial overlaps
  [...anns].sort((a,b)=>b.text.length-a.text.length).forEach(ann=>{
    const safeFind=ann.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                          .replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const cls=ann.type==='clue'?'hl-yellow':'hl-cyan';
    const ttT=ann.type==='clue'?'yellow':'cyan';
    const ttL=ann.type==='clue'?'★ Diagnostic Clue':'⬤ Distractor';
    const tip=`<div class="tooltip-wrap"><div class="tooltip-box tt-${ttT}"><div class="tooltip-type">${ttL}</div>${esc(ann.tooltip)}</div></div>`;
    html=html.replace(new RegExp(safeFind,'g'),`<span class="hl ${cls}" tabindex="0">$&${tip}</span>`);
  });
  el.innerHTML=html;
}

/* ── ACCORDION ── */
function toggleClue(row){
  const open=row.classList.contains('open');
  row.closest('.section-card').querySelectorAll('.clue-row.open').forEach(r=>r.classList.remove('open'));
  if(!open) row.classList.add('open');
}
function toggleDetail(id,btn){
  const b=document.getElementById(id);
  const open=b.classList.toggle('open');
  btn.textContent=open?'Hide Explanation':'Detailed Explanation';
}

init();
</script>
